<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аминокислоты: 3D-модели</title>
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.0.5/build/3Dmol-min.js"></script>
<style>
:root{--bg:#050510;--panel:#111122;--accent:#4fc3f7;--text:#e0e0e0;--sec:#a0a0b0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid #333;padding:12px 20px;z-index:100;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;color:var(--accent);letter-spacing:1px}
.back{padding:8px 16px;border:1px solid #444;border-radius:20px;color:var(--text);text-decoration:none;font-size:14px}
.back:hover{background:var(--accent);color:#000}
main{flex:1;max-width:900px;margin:0 auto;width:100%;padding:20px;display:flex;flex-direction:column;align-items:center}
h1{color:var(--accent);font-size:22px}
#viewer{width:450px;height:420px;max-width:95vw;position:relative;border:1px solid #333;border-radius:12px;background:rgba(0,0,0,.3);box-shadow:0 0 20px rgba(79,195,247,.15)}
#status{position:absolute;bottom:8px;left:12px;font-size:12px;color:#888}
.info{text-align:center;margin:14px 0}
.amino-name{font-size:26px;color:var(--accent);font-weight:bold}
.amino-formula{font-family:'Courier New',monospace;color:#fff;background:#000;padding:5px 12px;border:1px solid #444;border-radius:5px;display:inline-block;margin-top:6px}
.amino-cat{margin-top:8px;color:var(--sec);text-transform:uppercase;font-size:12px;letter-spacing:1px}
.amino-desc{max-width:600px;color:var(--sec);margin-top:6px;font-size:14px}
.controls{display:flex;gap:16px;margin:16px 0}
.nav-btn{padding:12px 26px;border:1px solid rgba(79,195,247,.4);background:rgba(255,255,255,.05);color:var(--accent);cursor:pointer;border-radius:8px;font-size:15px;font-weight:bold;transition:.2s}
.nav-btn:hover{background:var(--accent);color:#000;transform:scale(1.05)}
.nav-btn:disabled{opacity:.25;cursor:not-allowed;transform:none}
.hint{background:rgba(255,255,255,.05);border-left:4px solid var(--accent);padding:14px;border-radius:8px;max-width:600px;color:var(--sec);font-size:13px;text-align:center}
.hint b{color:var(--accent)}
</style>
</head>
<body>
<header>
<span class="logo">🧬 Аминокислоты (3D)</span>
<a class="back" href="index.html">← К моделям</a>
</header>
<main>
<h1>Строение 20 аминокислот</h1>
<div id="viewer"><div id="status">Загрузка...</div></div>

<div class="info">
<div class="amino-name" id="amino-name"></div>
<div class="amino-formula" id="amino-formula"></div>
<div class="amino-cat" id="amino-cat"></div>
<div class="amino-desc" id="amino-desc"></div>
</div>

<div class="controls">
<button class="nav-btn" id="prev" onclick="change(-1)">← Назад</button>
<button class="nav-btn" id="next" onclick="change(1)">Вперёд →</button>
</div>

<div class="hint">
<b>Управление:</b> вращай молекулу левой кнопкой мыши, приближай — колёсиком, сдвигай — правой кнопкой. Модель шаростержневая, цвета CPK: углерод — серый, азот — синий, кислород — красный, сера — жёлтая, водород — белый.
</div>
</main>

<script>
// CID — идентификатор молекулы в PubChem (оттуда берутся готовые 3D-координаты)
var aminoAcids = [
{name:"Аланин", cid:5950, formula:"C₃H₇NO₂", cat:"Неполярная (гидрофобная)", desc:"Самая простая аминокислота после глицина: боковая группа — метил (-CH₃). Кодон GCU/GCC/GCA/GCG."},
{name:"Валин", cid:6287, formula:"C₅H₁₁NO₂", cat:"Неполярная (гидрофобная)", desc:"Изомер лейцина. Заменимая аминокислота, кодон GUA/GUG/GUU/GUC."},
{name:"Лейцин", cid:6106, formula:"C₆H₁₃NO₂", cat:"Неполярная (гидрофобная)", desc:"Одна из самых распространённых в белках. Незаменимая. Кодон UUA/UUG/CUU-CUG."},
{name:"Изолейцин", cid:6306, formula:"C₆H₁₃NO₂", cat:"Неполярная (гидрофобная)", desc:"Изомер лейцина: разветвление боковой цепи в другом месте. Незаменимая. Кодон AUU/AUA/AUC."},
{name:"Метионин", cid:6137, formula:"C₅H₁₁NO₂S", cat:"Неполярная (гидрофобная)", desc:"Содержит атом серы (S). Всегда первый аминокислотный остаток в синтезе белка — стартовый кодон AUG."},
{name:"Пролин", cid:145742, formula:"C₅H₉NO₂", cat:"Неполярная (гидрофобная)", desc:"Единственная аминокислота с вторичной аминогруппой: боковая цепь замкнута в кольцо вместе с аминогруппой. Ломает спирали белков."},
{name:"Фенилаланин", cid:6140, formula:"C₉H₁₁NO₂", cat:"Неполярная (гидрофобная)", desc:"Содержит бензольное кольцо. Незаменимая. При её неусвоении развивается болезнь фенилкетонурия."},
{name:"Триптофан", cid:6305, formula:"C₁₁H₁₂N₂O₂", cat:"Неполярная (гидрофобная)", desc:"Самая большая из 20 аминокислот: бициклическая индольная группировка. Из неё синтезируется серотонин."},
{name:"Глицин", cid:750, formula:"C₂H₅NO₂", cat:"Полярная (нейтральная)", desc:"Простейшая аминокислота: боковая группа — просто атом водорода. Не имеет оптических изомеров."},
{name:"Серин", cid:5951, formula:"C₃H₇NO₃", cat:"Полярная (нейтральная)", desc:"Боковая группа — спиртовая (-OH). Участвует в активных центрах ферментов."},
{name:"Треонин", cid:6108, formula:"C₄H₉NO₃", cat:"Полярная (нейтральная)", desc:"Боковая группа с гидроксильной (-OH). Незаменимая аминокислота."},
{name:"Цистеин", cid:5862, formula:"C₃H₇NO₂S", cat:"Полярная (нейтральная)", desc:"Содержит сульфгидрильную группу (-SH). Два цистеина образуют дисульфидный мостик — цистин, укрепляющий структуру белка (кератин волос)."},
{name:"Тирозин", cid:6057, formula:"C₉H₁₁NO₃", cat:"Полярная (нейтральная)", desc:"Фенилаланин с добавленной гидроксильной группой (-OH) на кольце. Предшественник адреналина, тироксина и меланина."},
{name:"Аспарагин", cid:6267, formula:"C₄H₈N₂O₃", cat:"Полярная (нейтральная)", desc:"Амид аспарагиновой кислоты: вместо -COOH боковая группа несёт -CONH₂."},
{name:"Глутамин", cid:5961, formula:"C₅H₁₀N₂O₃", cat:"Полярная (нейтральная)", desc:"Амид глутаминовой кислоты. Главная транспортная форма аммиака (азота) в крови."},
{name:"Лизин", cid:5962, formula:"C₆H₁₄N₂O₂", cat:"Основная", desc:"Длинная боковая цепь с аминогруппой (-NH₂) на конце. Незаменимая: его нет в злаках."},
{name:"Аргинин", cid:6322, formula:"C₆H₁₄N₄O₂", cat:"Основная", desc:"Самая основная аминокислота: боковая цепь несёт гуанидиновую группировку. Участвует в цикле мочевины."},
{name:"Гистидин", cid:6274, formula:"C₆H₉N₃O₂", cat:"Основная", desc:"Содержит имидазольное кольцо. Из него синтезируется гистамин, отвечающий за аллергические реакции."},
{name:"Аспарагиновая кислота", cid:5960, formula:"C₄H₇NO₄", cat:"Кислая", desc:"Две карбоксильные группы (-COOH): боковая цепь несёт отрицательный заряд при pH 7. Названа в честь спаржи (asparagus)."},
{name:"Глутаминовая кислота", cid:33032, formula:"C₅H₉NO₄", cat:"Кислая", desc:"Её соль — глутамат натрия, усилитель вкуса. Также главный возбуждающий нейромедиатор мозга."}
];

var current = 0;
var viewer = null;
var loading = false;

function initViewer(){
  viewer = $3Dmol.createViewer(document.getElementById('viewer'), {
    backgroundColor: '#050510'
  });
}

function render(){
  if(loading) return;
  var a = aminoAcids[current];
  loading = true;
  document.getElementById('status').textContent = 'Загрузка молекулы...';
  document.getElementById('status').style.color = '#4fc3f7';

  viewer.clear();
  $3Dmol.download('cid:' + a.cid, viewer, {format:'sdf'}, function(){
    viewer.setStyle({}, {
      stick: {radius: 0.18},
      sphere: {scale: 0.28}
    });
    viewer.zoomTo();
    viewer.render();
    loading = false;
    document.getElementById('status').textContent = 'Вращай мышью, приближай колёсиком';
    document.getElementById('status').style.color = '#4fc3f7';
  });

  document.getElementById('amino-name').textContent = a.name;
  document.getElementById('amino-formula').textContent = a.formula;
  document.getElementById('amino-cat').textContent = a.cat;
  document.getElementById('amino-desc').textContent = a.desc;

  document.getElementById('prev').disabled = (current === 0);
  document.getElementById('next').disabled = (current === aminoAcids.length - 1);
}

function change(step){
  var next = current + step;
  if(next < 0 || next >= aminoAcids.length) return;
  current = next;
  render();
}

window.addEventListener('load', function(){
  initViewer();
  render();
});
</script>
</body>
</html>
