<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клетки 4 царств — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);
       padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;z-index:2}
  #back,#molBack{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3;cursor:pointer;border:0;font-size:14px}
  #molBack{display:none}
  #tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
  #tabs button,#molBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
       border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
  #tabs button.active{background:#4fc3f7;color:#00243a;font-weight:bold}
  #molBtn{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);display:none;
       background:#1b5e20;border-color:#66bb6a;font-weight:bold;z-index:2}
  #molBtn:hover{background:#2e7d32}
</style>
</head>
<body>
<a id="back" href="index.html">← Назад</a>
<button id="molBack">← К клетке</button>
<div id="info"></div>
<button id="molBtn">🧬 Показать стенку на молекулярном уровне</button>
<div id="tabs">
  <button data-k="plant" class="active">Растения</button>
  <button data-k="animal">Животные</button>
  <button data-k="fungi">Грибы</button>
  <button data-k="bact">Бактерии</button>
</div>

<script>
window.onerror=function(msg){
  var el=document.getElementById('info');
  if(el) el.innerHTML='<span style="color:#ff8787">Ошибка: '+msg+'</span>';
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
var camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 9);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, .5));
var dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(5,8,5); scene.add(dl);
var dl2 = new THREE.DirectionalLight(0x88aaff, .4); dl2.position.set(-5,-3,-5); scene.add(dl2);

function matStd(color, opts){
  if(!opts) opts = {};
  opts.color = new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(!s) s = 0.12;
  var m = new THREE.Mesh(new THREE.SphereGeometry(s,10,10), matStd(color,{roughness:.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function addCylV(parent,a,b,r,color){
  var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8), matStd(color));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m); return m;
}
function randomDots(group,n,color,s){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, b=Math.random()*Math.PI, r=Math.random()*1.2;
    dot(group, r*Math.sin(b)*Math.cos(a), (Math.random()-.5)*1.4, r*Math.sin(b)*Math.sin(a), color, s);
  }
}
function nucleus(group,x,y,z,color){
  if(!color) color=0x7e57c2;
  var nuc = new THREE.Mesh(new THREE.SphereGeometry(.75,32,32),
      matStd(color,{transparent:true,opacity:.85,roughness:.4}));
  nuc.position.set(x,y,z); group.add(nuc);
  var nuc2 = new THREE.Mesh(new THREE.SphereGeometry(.3,24,24), matStd(0x5e35b1));
  nuc2.position.set(x,y+.15,z); group.add(nuc2);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(.85,32,32),
      matStd(0xffffff,{transparent:true,opacity:.12}));
  mem.position.set(x,y,z); group.add(mem);
}
function mitochondria(group,x,y,z){
  var mit = new THREE.Mesh(new THREE.SphereGeometry(.3,20,20), matStd(0xef5350,{roughness:.5}));
  mit.scale.set(1.5,.8,.8);
  mit.position.set(x,y,z);
  mit.rotation.z=Math.random()*Math.PI;
  group.add(mit);
}

/* ---------- КЛЕТКИ ЦАРСТВ ---------- */
function buildPlant(){
  var g = new THREE.Group();
  var wall = new THREE.Mesh(new THREE.BoxGeometry(4.2,4.2,4.2,3,3,3),
      matStd(0x66bb6a,{transparent:true,opacity:.15}));
  wall.rotation.y=Math.PI/4; g.add(wall);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
      matStd(0x43a047,{transparent:true,opacity:.25}));
  g.add(mem);
  var vac = new THREE.Mesh(new THREE.SphereGeometry(1.15,32,32),
      matStd(0x4fc3f7,{transparent:true,opacity:.35}));
  vac.position.set(0,-.6,0); g.add(vac);
  var spots=[[1.3,.8,.6],[-1.4,.6,.5],[.6,1.2,-.8],[-.8,-1.2,.9],[1.5,-.9,-.4]];
  for(var i=0;i<spots.length;i++){
    var ch = new THREE.Mesh(new THREE.SphereGeometry(.34,20,20), matStd(0x2e7d32,{roughness:.5}));
    ch.scale.set(1.5,.8,.8); ch.position.set(spots[i][0],spots[i][1],spots[i][2]);
    ch.rotation.set(Math.random(),Math.random(),Math.random()); g.add(ch);
  }
  nucleus(g,0,1.1,0);
  mitochondria(g,1.2,.2,.9); mitochondria(g,-1.2,-.3,-.8);
  randomDots(g,25,0xffca28,.07);
  return g;
}
function buildAnimal(){
  var g = new THREE.Group();
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.1,48,48),
      matStd(0x42a5f5,{transparent:true,opacity:.3}));
  g.add(mem);
  nucleus(g,0,.6,0,0x5c6bc0);
  mitochondria(g,1.2,-.6,.5); mitochondria(g,-1.3,-.4,-.5); mitochondria(g,.2,-1.2,1);
  var ly=[[1.5,.9,-.4],[-1.6,.8,.3],[.5,1.4,.6]];
  for(var i=0;i<ly.length;i++) dot(g,ly[i][0],ly[i][1],ly[i][2],0xff7043,.18);
  randomDots(g,30,0xffca28,.07);
  return g;
}
function buildFungi(){
  var g = new THREE.Group();
  var wall = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
      matStd(0xa1887f,{transparent:true,opacity:.18}));
  wall.scale.set(1,.9,1); g.add(wall);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.05,32,32),
      matStd(0x8d6e63,{transparent:true,opacity:.3}));
  mem.scale.set(1,.9,1); g.add(mem);
  nucleus(g,0,.8,0);
  var vac = new THREE.Mesh(new THREE.SphereGeometry(.8,24,24),
      matStd(0x4fc3f7,{transparent:true,opacity:.35}));
  vac.position.set(0,-.8,.3); g.add(vac);
  mitochondria(g,1.2,-.2,-.6); mitochondria(g,-1.2,.2,.6);
  randomDots(g,22,0xffca28,.07);
  return g;
}
function buildBact(){
  var g = new THREE.Group();
  var bodyMat = matStd(0x26a69a,{transparent:true,opacity:.35});
  var body = new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,3.2,32), bodyMat);
  g.add(body);
  var cap1 = new THREE.Mesh(new THREE.SphereGeometry(.9,32,32), bodyMat);
  cap1.position.y=1.6; g.add(cap1);
  var cap2 = new THREE.Mesh(new THREE.SphereGeometry(.9,32,32), bodyMat);
  cap2.position.y=-1.6; g.add(cap2);
  var dna = new THREE.Mesh(new THREE.TorusGeometry(.55,.09,12,40), matStd(0xffee58,{roughness:.4}));
  dna.rotation.x=Math.PI/2; dna.position.y=.2; g.add(dna);
  var pl = new THREE.Mesh(new THREE.TorusGeometry(.2,.05,10,24), matStd(0xff7043));
  pl.rotation.x=Math.PI/2.5; pl.position.set(.9,-.7,.4); g.add(pl);
  randomDots(g,35,0xffca28,.08);
  var flag = new THREE.Mesh(new THREE.TorusGeometry(1.2,.04,8,50,Math.PI*1.4), matStd(0xeeff41));
  flag.position.set(0,-2.6,0); flag.rotation.x=Math.PI/2.2; g.add(flag);
  return g;
}

/* ---------- ПОДПИСИ ---------- */
function makeLabel(text,x,y,z,parent,scale){
  if(!scale) scale=0.8;
  var cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  var c=cv.getContext('2d');
  c.font='bold 40px Arial';
  var w=Math.min(c.measureText(text).width+40,500);
  c.fillStyle='rgba(8,12,28,0.85)'; c.fillRect((512-w)/2,20,w,88);
  c.strokeStyle='rgba(140,170,255,0.8)'; c.strokeRect((512-w)/2,20,w,88);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,256,64);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));
  sp.scale.set(2.4*scale,0.6*scale,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* ---------- МОЛЕКУЛЯРНЫЙ УРОВЕНЬ ---------- */
/* один фосфолипид: жёлтая головка + два коричневых хвоста */
function lipid(g,x,z){
  var wob=Math.sin(x*0.9)*0.06+Math.sin(z*0.7)*0.06;
  var top=0.45+wob, bot=-0.45+wob;
  dot(g,x,top,z,0xffd54f,0.16);
  addCylV(g,new THREE.Vector3(x,top-0.08,z),new THREE.Vector3(x+0.05,bot+0.08,z-0.06),0.04,0xa1887f);
  addCylV(g,new THREE.Vector3(x,top-0.08,z),new THREE.Vector3(x-0.05,bot+0.08,z+0.06),0.04,0xa1887f);
}
function molBilayer(g){
  for(var xi=-6;xi<=6;xi++)for(var zi=-2;zi<=2;zi++) lipid(g,xi*0.5,zi*0.5);
}
/* цепочка из «колец»-сахаров вдоль оси X на высоте y */
function sugarChain(g,y,z,color,step,n){
  var prev=null;
  for(var i=0;i<n;i++){
    var x=(i-(n-1)/2)*step;
    var ring=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.07,10,20), matStd(color,{roughness:.5}));
    ring.position.set(x,y+Math.sin(i*1.3)*0.05,z);
    ring.rotation.y=Math.PI/2;
    ring.rotation.z=Math.sin(i)*0.4;
    g.add(ring);
    if(prev!==null){
      addCylV(g,prev,ring.position.clone(),0.04,color);
      if(i%2===0) dot(g,(x+prev.x)/2,y+0.22,z,0x4fc3f7,0.06);
    }
    prev=ring.position.clone();
  }
}
function molCellulose(g){
  makeLabel('Целлюлоза: цепочки глюкозы',0,2.1,0,g,0.9);
  makeLabel('водородные связи (голубые)',0,1.75,-1.4,g,0.7);
  sugarChain(g,1.35,-1.0,0x8bc34a,0.42,14);
  sugarChain(g,1.35,-0.4,0x8bc34a,0.42,14);
  sugarChain(g,1.05, 0.3,0x7cb342,0.42,14);
  sugarChain(g,1.05, 0.9,0x7cb342,0.42,14);
  sugarChain(g,0.75, 1.5,0x689f38,0.42,14);
  for(var i=-5;i<=5;i++){
    addCylV(g,new THREE.Vector3(i*0.84+0.2,1.35,-0.75),new THREE.Vector3(i*0.84+0.2,1.05,0.55),0.025,0x4fc3f7);
  }
}
function molChitin(g){
  makeLabel('Хитин: цепочки N-ацетилглюкозамина',0,2.1,0,g,0.9);
  makeLabel('азотистые группы (голубые)',0,1.75,-1.4,g,0.7);
  sugarChain(g,1.4,-0.9,0xa1887f,0.42,14);
  sugarChain(g,1.4,-0.2,0xa1887f,0.42,14);
  sugarChain(g,1.12,0.5,0x8d6e63,0.42,14);
  sugarChain(g,1.12,1.2,0x8d6e63,0.42,14);
  for(var i=-5;i<=5;i++){
    addCylV(g,new THREE.Vector3(i*0.84+0.2,1.4,-0.55),new THREE.Vector3(i*0.84+0.2,1.12,0.85),0.025,0x4fc3f7);
    dot(g,i*0.84,1.62,-0.9,0x4fc3f7,0.07);
  }
}
function molMurein(g){
  makeLabel('Муреин: NAG-NAM нити + пептидные мостики',0,2.2,0,g,0.9);
  makeLabel('жёлтые — NAG, оранжевые — NAM, фиолетовые — мостики',0,1.9,-1.6,g,0.7);
  for(var row=0;row<2;row++){
    var y=row===0?1.4:1.0, prev=null;
    for(var i=0;i<12;i++){
      var x=(i-5.5)*0.5;
      var c=(i%2===0)?0xffee58:0xffa726;
      var b=dot(g,x,y,-0.6,c,0.15);
      if(prev!==null) addCylV(g,prev,b.position.clone(),0.05,c);
      prev=b.position.clone();
    }
  }
  for(var i=0;i<7;i++){
    var x=(i-3)*0.7, px=x, py=1.0;
    for(var j=0;j<4;j++){
      var nb=dot(g,px,py,-0.6,0xce93d8,0.08);
      if(j>0) addCylV(g,new THREE.Vector3(x,py-0.2,-0.6),nb.position.clone(),0.03,0xce93d8);
      px+=(j%2===0)?0.08:-0.08; py+=0.2;
    }
  }
}
function molGlycocalyx(g){
  makeLabel('Гликокаликс: белок + ветвящиеся углеводы',0,2.2,0,g,0.9);
  var px=[-3.5,-1.5,0.5,2.5];
  for(var i=0;i<px.length;i++){
    var x=px[i];
    addCylV(g,new THREE.Vector3(x,-0.45,0),new THREE.Vector3(x,0.55,0),0.09,0x5c6bc0);
    dot(g,x,-0.45,0,0x5c6bc0,0.16); dot(g,x,0.55,0,0x5c6bc0,0.16);
    var bx=x, by=0.68, cols=[0xba68c8,0x9fa8da,0x80cbc4];
    for(var br=0;br<2;br++){
      var cx=bx+(br===0?-0.5:0.55), n=3+br;
      var cx2=cx, cy=by;
      for(var j=0;j<n;j++){
        var col=cols[j%3];
        var nb=dot(g,cx2,cy,0,col,0.1);
        addCylV(g,new THREE.Vector3(cx2,cy-0.22,0),nb.position.clone(),0.03,col);
        cx2+=(br===0?-0.16:0.2); cy+=0.22;
      }
    }
  }
}
function buildMol(k){
  var g=new THREE.Group();
  molBilayer(g);
  makeLabel('Фосфолипидный бислой (жёлтые головки, хвосты внутри)',0,-1.05,1.6,g,0.85);
  if(k==='plant') molCellulose(g);
  else if(k==='fungi') molChitin(g);
  else if(k==='bact') molMurein(g);
  else molGlycocalyx(g);
  return g;
}

/* ---------- ТЕКСТЫ ---------- */
var texts = {
  plant:"<b>Клетка растения:</b> целлюлозная стенка, хлоропласты (тёмно-зелёные), вакуоль (голубая), ядро, митохондрии, рибосомы.<br><small>Выберите клетку — и нажмите зелёную кнопку, чтобы увидеть стенку на молекулярном уровне.</small>",
  animal:"<b>Клетка животного:</b> только мембрана, ядро, митохондрии, лизосомы (оранжевые), рибосомы.<br><small>Выберите клетку — и нажмите зелёную кнопку, чтобы увидеть мембрану на молекулярном уровне.</small>",
  fungi:"<b>Клетка гриба:</b> хитиновая стенка, ядро, вакуоль, митохондрии, рибосомы.<br><small>Выберите клетку — и нажмите зелёную кнопку, чтобы увидеть стенку на молекулярном уровне.</small>",
  bact:"<b>Бактерия (прокариот):</b> нет ядра, кольцевая ДНК (жёлтая), плазмида, жгутик.<br><small>Выберите клетку — и нажмите зелёную кнопку, чтобы увидеть стенку на молекулярном уровне.</small>"
};
var molTexts = {
  plant:"<b>Молекулярный уровень — стенка растения.</b> Двойной липидный слой собран из отдельных фосфолипидов: жёлтые «головки» (любят воду) смотрят наружу и внутрь клетки, коричневые «хвосты» прячутся внутри. Сверху — <b>целлюлоза</b>: длинные цепочки колец глюкозы (зелёные), скреплённые водородными связями (голубые точки). Волокна лежат слоями крест-накрест — это даёт стенке прочность на разрыв в любом направлении.",
  animal:"<b>Молекулярный уровень — мембрана животной клетки.</b> Клеточной стенки нет. Сквозь бислой проходят <b>белки-интегрины</b> (синие колонны), а снаружи от них отрастают ветвящиеся цепочки сахаров — <b>гликокаликс</b> (фиолетово-голубые веточки). Он узнаёт сигналы, склеивает клетки в ткани и защищает поверхность.",
  fungi:"<b>Молекулярный уровень — стенка гриба.</b> Под бислоем — <b>хитин</b>: цепочки N-ацетилглюкозамина (коричневые кольца), соединённые водородными связями (голубые точки). Голубые выступы — азотистые ацетамидные группы, отличающие хитин от целлюлозы. Хитин — тот же полимер, что в панцире раков и жуков.",
  bact:"<b>Молекулярный уровень — стенка бактерии.</b> Сетка <b>муреина (пептидогликана)</b>: жёлтые кольца — сахар NAG, оранжевые — NAM, они образуют прочные нити, а фиолетовые мостики — короткие <b>пептидные цепочки</b>, сшивающие нити в решётку. Эта «сеть-невидимка» держит давление внутри клетки; пенициллин мешает сшивать мостики, и бактерия лопается."
};

/* ---------- СБОРКА И ПЕРЕКЛЮЧЕНИЕ ---------- */
var groups = {plant:buildPlant(), animal:buildAnimal(), fungi:buildFungi(), bact:buildBact()};
for(var k in groups){ groups[k].visible=false; scene.add(groups[k]); }
var molGroup=null, molMode=false, chosen=null;
var info=document.getElementById('info');
var tabsEl=document.getElementById('tabs');
var molBtn=document.getElementById('molBtn');
var molBack=document.getElementById('molBack');

function show(k){
  chosen=k; molMode=false;
  for(var key in groups) groups[key].visible=(key===k);
  if(molGroup){ scene.remove(molGroup); molGroup=null; }
  info.innerHTML=texts[k];
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active',btns[i].getAttribute('data-k')===k);
  molBtn.style.display='inline-block';
  molBack.style.display='none';
  tabsEl.style.display='flex';
  controls.target.set(0,0.3,0);
  camera.position.set(0,3,9);
}
function showMol(){
  molMode=true;
  for(var key in groups) groups[key].visible=false;
  if(molGroup) scene.remove(molGroup);
  molGroup=buildMol(chosen||'plant');
  scene.add(molGroup);
  info.innerHTML=molTexts[chosen];
  molBtn.style.display='none';
  molBack.style.display='inline-block';
  tabsEl.style.display='none';
  controls.target.set(0,0.6,0);
  camera.position.set(0,2.2,8);
}
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){ btn.onclick=function(){ show(btn.getAttribute('data-k')); }; })(tabBtns[i]);
}
molBtn.onclick=showMol;
molBack.onclick=function(){ show(chosen||'plant'); };

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
