<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клетки 4 царств — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);
       padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;z-index:2}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3}
  #tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
  #tabs button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
       border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
  #tabs button.active{background:#4fc3f7;color:#00243a;font-weight:bold}
</style>
</head>
<body>
<a id="back" href="index.html">← Назад</a>
<div id="info"></div>
<div id="tabs">
  <button data-k="plant" class="active">Растения</button>
  <button data-k="animal">Животные</button>
  <button data-k="fungi">Грибы</button>
  <button data-k="bact">Бактерии</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
var camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 4, 12);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(2.5, 0.3, 0);
scene.add(new THREE.AmbientLight(0xffffff, .5));
var dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(5,8,5); scene.add(dl);
var dl2 = new THREE.DirectionalLight(0x88aaff, .4); dl2.position.set(-5,-3,-5); scene.add(dl2);

function matStd(color, opts){
  if(!opts) opts = {};
  opts.color = new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(!s) s = 0.12;
  var m = new THREE.Mesh(new THREE.SphereGeometry(s,10,10), matStd(color,{roughness:.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function addCylV(parent,a,b,r,color){
  var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8), matStd(color));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m); return m;
}
function randomDots(group,n,color,s){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, b=Math.random()*Math.PI, r=Math.random()*1.2;
    dot(group, r*Math.sin(b)*Math.cos(a), (Math.random()-.5)*1.4, r*Math.sin(b)*Math.sin(a), color, s);
  }
}
function nucleus(group,x,y,z,color){
  if(!color) color=0x7e57c2;
  var nuc = new THREE.Mesh(new THREE.SphereGeometry(.75,32,32),
      matStd(color,{transparent:true,opacity:.85,roughness:.4}));
  nuc.position.set(x,y,z); group.add(nuc);
  var nuc2 = new THREE.Mesh(new THREE.SphereGeometry(.3,24,24), matStd(0x5e35b1));
  nuc2.position.set(x,y+.15,z); group.add(nuc2);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(.85,32,32),
      matStd(0xffffff,{transparent:true,opacity:.12}));
  mem.position.set(x,y,z); group.add(mem);
}
function mitochondria(group,x,y,z){
  var mit = new THREE.Mesh(new THREE.SphereGeometry(.3,20,20), matStd(0xef5350,{roughness:.5}));
  mit.scale.set(1.5,.8,.8);
  mit.position.set(x,y,z);
  mit.rotation.z=Math.random()*Math.PI;
  group.add(mit);
}

/* ---------- КЛЕТКИ ЦАРСТВ ---------- */
function buildPlant(){
  var g = new THREE.Group();
  var wall = new THREE.Mesh(new THREE.BoxGeometry(4.2,4.2,4.2,3,3,3),
      matStd(0x66bb6a,{transparent:true,opacity:.15}));
  wall.rotation.y=Math.PI/4; g.add(wall);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
      matStd(0x43a047,{transparent:true,opacity:.25}));
  g.add(mem);
  var vac = new THREE.Mesh(new THREE.SphereGeometry(1.15,32,32),
      matStd(0x4fc3f7,{transparent:true,opacity:.35}));
  vac.position.set(0,-.6,0); g.add(vac);
  var spots=[[1.3,.8,.6],[-1.4,.6,.5],[.6,1.2,-.8],[-.8,-1.2,.9],[1.5,-.9,-.4]];
  for(var i=0;i<spots.length;i++){
    var ch = new THREE.Mesh(new THREE.SphereGeometry(.34,20,20), matStd(0x2e7d32,{roughness:.5}));
    ch.scale.set(1.5,.8,.8); ch.position.set(spots[i][0],spots[i][1],spots[i][2]);
    ch.rotation.set(Math.random(),Math.random(),Math.random()); g.add(ch);
  }
  nucleus(g,0,1.1,0);
  mitochondria(g,1.2,.2,.9); mitochondria(g,-1.2,-.3,-.8);
  randomDots(g,25,0xffca28,.07);
  return g;
}
function buildAnimal(){
  var g = new THREE.Group();
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.1,48,48),
      matStd(0x42a5f5,{transparent:true,opacity:.3}));
  g.add(mem);
  nucleus(g,0,.6,0,0x5c6bc0);
  mitochondria(g,1.2,-.6,.5); mitochondria(g,-1.3,-.4,-.5); mitochondria(g,.2,-1.2,1);
  var ly=[[1.5,.9,-.4],[-1.6,.8,.3],[.5,1.4,.6]];
  for(var i=0;i<ly.length;i++) dot(g,ly[i][0],ly[i][1],ly[i][2],0xff7043,.18);
  randomDots(g,30,0xffca28,.07);
  return g;
}
function buildFungi(){
  var g = new THREE.Group();
  var wall = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
      matStd(0xa1887f,{transparent:true,opacity:.18}));
  wall.scale.set(1,.9,1); g.add(wall);
  var mem = new THREE.Mesh(new THREE.SphereGeometry(2.05,32,32),
      matStd(0x8d6e63,{transparent:true,opacity:.3}));
  mem.scale.set(1,.9,1); g.add(mem);
  nucleus(g,0,.8,0);
  var vac = new THREE.Mesh(new THREE.SphereGeometry(.8,24,24),
      matStd(0x4fc3f7,{transparent:true,opacity:.35}));
  vac.position.set(0,-.8,.3); g.add(vac);
  mitochondria(g,1.2,-.2,-.6); mitochondria(g,-1.2,.2,.6);
  randomDots(g,22,0xffca28,.07);
  return g;
}
function buildBact(){
  var g = new THREE.Group();
  var bodyMat = matStd(0x26a69a,{transparent:true,opacity:.35});
  var body = new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,3.2,32), bodyMat);
  g.add(body);
  var cap1 = new THREE.Mesh(new THREE.SphereGeometry(.9,32,32), bodyMat);
  cap1.position.y=1.6; g.add(cap1);
  var cap2 = new THREE.Mesh(new THREE.SphereGeometry(.9,32,32), bodyMat);
  cap2.position.y=-1.6; g.add(cap2);
  var dna = new THREE.Mesh(new THREE.TorusGeometry(.55,.09,12,40), matStd(0xffee58,{roughness:.4}));
  dna.rotation.x=Math.PI/2; dna.position.y=.2; g.add(dna);
  var pl = new THREE.Mesh(new THREE.TorusGeometry(.2,.05,10,24), matStd(0xff7043));
  pl.rotation.x=Math.PI/2.5; pl.position.set(.9,-.7,.4); g.add(pl);
  randomDots(g,35,0xffca28,.08);
  var flag = new THREE.Mesh(new THREE.TorusGeometry(1.2,.04,8,50,Math.PI*1.4), matStd(0xeeff41));
  flag.position.set(0,-2.6,0); flag.rotation.x=Math.PI/2.2; g.add(flag);
  return g;
}

/* ---------- РАЗРЕЗ ОБОЛОЧКИ ---------- */
function makeLabel(text,x,y,z,parent,scale){
  if(!scale) scale=0.8;
  var cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  var c=cv.getContext('2d');
  c.font='bold 44px Arial';
  var w=Math.min(c.measureText(text).width+40,500);
  c.fillStyle='rgba(8,12,28,0.85)'; c.fillRect((512-w)/2,20,w,88);
  c.strokeStyle='rgba(140,170,255,0.8)'; c.strokeRect((512-w)/2,20,w,88);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,256,64);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));
  sp.scale.set(2.4*scale,0.6*scale,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* двойной липидный слой: два ряда «головок» + «хвосты» между ними */
function makeBilayer(g){
  for(var i=-7;i<=7;i++){
    var x=i*0.36;
    dot(g,x,0.28,0,0xffd54f,0.11);
    dot(g,x,-0.28,0,0xffd54f,0.11);
    addCylV(g,new THREE.Vector3(x,0.22,0),new THREE.Vector3(x,-0.22,0),0.03,0xa1887f);
  }
}

/* слой параллельных волокон (целлюлоза / хитин), повернутых под углом */
function fiberLayer(g,y,rotY,color){
  for(var j=-2;j<=2;j++){
    var cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,5.6,8), matStd(color,{roughness:.55}));
    cyl.rotation.z=Math.PI/2;
    if(rotY) cyl.rotation.y=rotY;
    cyl.position.set(0,y,j*0.3);
    g.add(cyl);
  }
}

/* сетка муреина: два волокна + пептидные перемычки с «узелками» */
function mureinMesh(g){
  var fib=0x9c27b0, node=0xce93d8;
  addCylV(g,new THREE.Vector3(-2.4,0.72,0),new THREE.Vector3(2.4,0.72,0),0.06,fib);
  addCylV(g,new THREE.Vector3(-2.4,1.02,0),new THREE.Vector3(2.4,1.02,0),0.06,fib);
  for(var i=0;i<11;i++){
    var x=-2.4+i*0.48;
    addCylV(g,new THREE.Vector3(x,0.72,0),new THREE.Vector3(x,1.02,0),0.035,node);
    dot(g,x,0.72,0,node,0.07);
    dot(g,x,1.02,0,node,0.07);
  }
}

/* гликокаликс: ветвящиеся цепочки гликопротеинов над мембраной */
function glycocalyx(g){
  var cols=[0xba68c8,0x9fa8da,0x80cbc4];
  for(var i=-6;i<=6;i++){
    var x=i*0.42+(Math.random()-.5)*0.15;
    if(Math.random()<0.25) continue;
    var col=cols[i%3];
    var y=0.42;
    var n=2+Math.floor(Math.random()*2);
    for(var j=0;j<n;j++){
      dot(g,x,y,0,col,0.09);
      var x2=x+(Math.random()-.5)*0.3;
      y+=0.22;
      addCylV(g,new THREE.Vector3(x,y-0.22,0),new THREE.Vector3(x2,y,0),0.025,col);
      x=x2;
    }
  }
}

function makeWallDetail(k){
  var g=new THREE.Group();
  g.position.set(6.4,0.3,0);
  makeBilayer(g);
  if(k==='plant'){
    fiberLayer(g,0.72,0,0x8bc34a);
    fiberLayer(g,0.98,Math.PI/3,0x7cb342);
    fiberLayer(g,1.24,Math.PI*2/3,0x689f38);
    makeLabel('Целлюлоза (волокна крест-накрест)',0,2.0,0,g,0.95);
  }else if(k==='fungi'){
    fiberLayer(g,0.72,0,0xa1887f);
    fiberLayer(g,0.94,Math.PI/4,0x8d6e63);
    fiberLayer(g,1.16,Math.PI/2.2,0x6d4c41);
    fiberLayer(g,1.38,Math.PI/3.2,0x5d4037);
    makeLabel('Хитин (плотные слои)',0,2.0,0,g,0.95);
  }else if(k==='bact'){
    mureinMesh(g);
    makeLabel('Муреин (пептидогликан — сетка)',0,1.9,0,g,0.95);
  }else{
    glycocalyx(g);
    makeLabel('Гликокаликс (гликопротеины) — стенки нет',0,2.0,0,g,0.9);
  }
  makeLabel('Фосфолипидный бислой',0,-1.0,0,g,0.85);
  return g;
}

/* ---------- ТЕКСТЫ ---------- */
var texts = {
  plant:"<b>Клетка растения:</b> целлюлозная стенка, хлоропласты (тёмно-зелёные), вакуоль (голубая), ядро, митохондрии, рибосомы.<br><b>Справа — разрез оболочки:</b> снаружи три слоя волокон <b>целлюлозы</b>, переплетённых крест-накрест (придают жёсткость), под ними фосфолипидный бислой (жёлтые головки — наружу и внутрь, коричневые «хвосты» — внутрь слоя).",
  animal:"<b>Клетка животного:</b> только мембрана, ядро, митохондрии, лизосомы (оранжевые), рибосомы.<br><b>Справа — разрез оболочки:</b> клеточной стенки нет! Снаружи бислоя — <b>гликокаликс</b>: ветвящиеся цепочки гликопротеинов и гликолипидов (узнают сигналы, склеивают клетки в ткани).",
  fungi:"<b>Клетка гриба:</b> хитиновая стенка, ядро, вакуоль, митохондрии, рибосомы.<br><b>Справа — разрез оболочки:</b> снаружи плотные слои волокон <b>хитина</b> (тот же полимер, что в панцире ракообразных), под ними фосфолипидный бислой.",
  bact:"<b>Бактерия (прокариот):</b> нет ядра, кольцевая ДНК (жёлтая), плазмида, жгутик.<br><b>Справа — разрез оболочки:</b> снаружи бислоя — <b>муреин (пептидогликан)</b>: сетка из сахарных нитей, скреплённых пептидными перемычками (фиолетовые узелки). Именно его разрушают антибиотики вроде пенициллина."
};

/* ---------- СБОРКА ---------- */
var groups = {plant:buildPlant(), animal:buildAnimal(), fungi:buildFungi(), bact:buildBact()};
for(var k in groups){ groups[k].visible=false; scene.add(groups[k]); }
var wallGroup=null;

function show(k){
  for(var key in groups) groups[key].visible=(key===k);
  if(wallGroup) scene.remove(wallGroup);
    wallGroup=makeWallDetail(k);
  scene.add(wallGroup);
  info.innerHTML=texts[k]+"<br><small>Вращай мышкой (или пальцем), колесо — приближение</small>";
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active',btns[i].getAttribute('data-k')===k);
}

var info=document.getElementById('info');
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){ btn.onclick=function(){ show(btn.getAttribute('data-k')); }; })(tabBtns[i]);
}
show('plant');

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
