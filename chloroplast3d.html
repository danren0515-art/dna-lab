<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хлоропласт — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#041a10;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);
       padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;z-index:2}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3}
</style>
</head>
<body>
<a id="back" href="cells3d.html">← К клеткам</a>
<div id="info"><b>Хлоропласт:</b> зелёное тело-«линза». Внутри — строма (полупрозрачная среда) и граны: стопки тилакоидов (зелёные диски). Именно в мембранах тилакоидов идёт световая фаза фотосинтеза. Кольцо ДНК (жёлтое) — свой геном.<br><small>Вращай мышкой, колесо — приближение</small></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x041a10);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.5));
const dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(5,8,5); scene.add(dl);
const dl2=new THREE.DirectionalLight(0x66ff99,.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

const chlor=new THREE.Group();
// внешняя и внутренняя мембраны (форма линзы)
const outer=new THREE.Mesh(new THREE.SphereGeometry(2.4,48,48),
  new THREE.MeshStandardMaterial({color:0x1b5e20,transparent:true,opacity:.25}));
outer.scale.set(1.6,.65,1); chlor.add(outer);
const inner=new THREE.Mesh(new THREE.SphereGeometry(2.2,48,48),
  new THREE.MeshStandardMaterial({color:0x2e7d32,transparent:true,opacity:.18}));
inner.scale.set(1.55,.6,1); chlor.add(inner);
// граны: стопки дисков-тилакоидов
function granum(x,y,z,tilt){
  const stack=new THREE.Group();
  for(let i=0;i<6;i++){
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.09,28),
      new THREE.MeshStandardMaterial({color:0x00c853,emissive:0x003d16,roughness:.4}));
    disc.position.y=i*.13; stack.add(disc);
  }
  stack.position.set(x,y,z); stack.rotation.x=tilt; chlor.add(stack);
  return stack;
}
granum(-1,.45,.4,.15); granum(.1,.6,-.5,-.1); granum(1,.3,.5,.2); granum(.4,-.6,.2,-.25);
// ламеллы — связи между гранами
[[-1,.5,.4,.1,.6,-.5],[.1,.6,-.5,1,.3,.5]].forEach(a=>{
  const pts=[new THREE.Vector3(a[0],a[1],a[2]),new THREE.Vector3((a[0]+a[3])/2,(a[1]+a[4])/2-.25,(a[2]+a[5])/2),new THREE.Vector3(a[3],a[4],a[5])];
  const curve=new THREE.CatmullRomCurve3(pts);
  chlor.add(new THREE.Mesh(new THREE.TubeGeometry(curve,20,.06,10,false),
    new THREE.MeshStandardMaterial({color:0x00c853,emissive:0x003d16})));
});
// кольцевая ДНК
const dna=new THREE.Mesh(new THREE.TorusGeometry(.45,.05,10,40),
  new THREE.MeshStandardMaterial({color:0xffee58}));
dna.rotation.x=Math.PI/2.2; dna.position.set(-.3,-.35,0); chlor.add(dna);
// рибосомы
for(let i=0;i<20;i++){
  const a=Math.random()*Math.PI*2,b=Math.random()*Math.PI;
  const d=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),new THREE.MeshStandardMaterial({color:0xffca28}));
  d.position.set(1.9*Math.sin(b)*Math.cos(a)*1.4,1.1*Math.cos(b)*.6,1.9*Math.sin(b)*Math.sin(a));
  chlor.add(d);
}
chlor.rotation.z=.15; scene.add(chlor);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);chlor.rotation.y+=.002;controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
