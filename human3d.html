<script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.5));
var dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(5,8,5); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88aaff,.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

function matStd(color,opts){
  if(!opts) opts={};
  opts.color=new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(!s) s=0.12;
  var m=new THREE.Mesh(new THREE.SphereGeometry(s,10,10),matStd(color,{roughness:.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function addCylV(parent,a,b,r,color){
  var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),matStd(color));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m); return m;
}

/* ПОДПИСИ: холст подстраивается под текст, длинные фразы переносятся на строки.
   Поэтому текст больше никогда не обрезается по краям. */
function makeLabel(text,x,y,z,parent,scale){
  if(!scale) scale=0.8;
  var maxLineW=520;
  var cv=document.createElement('canvas');
  var c=cv.getContext('2d');
  c.font='bold 36px Arial';
  var words=String(text).split(' ');
  var lines=[],cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(c.measureText(t).width>maxLineW&&cur){lines.push(cur);cur=words[i];}
    else cur=t;
  }
  if(cur)lines.push(cur);
  var w=0;
  for(var i=0;i<lines.length;i++) w=Math.max(w,c.measureText(lines[i]).width);
  cv.width=Math.ceil(w+44);
  cv.height=lines.length*46+28;
  c=cv.getContext('2d');
  c.font='bold 36px Arial';
  c.fillStyle='rgba(8,12,28,0.85)';
  c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle='rgba(140,170,255,0.8)';
  c.lineWidth=3;
  c.strokeRect(2,2,cv.width-4,cv.height-4);
  c.fillStyle='#fff';
  c.textAlign='center';
  c.textBaseline='middle';
  for(var i=0;i<lines.length;i++)
    c.fillText(lines[i],cv.width/2,23+i*46);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false
  }));
  var hgt=0.62*scale;
  sp.scale.set(hgt*cv.width/cv.height,hgt,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* ---------- КЛЕТКИ ---------- */

/* НЕРВНАЯ: тело, дендриты, аксон в миелине, терминали */
function dendrite(g,p,dir,len,r,depth){
  var end=p.clone().addScaledVector(dir,len);
  addCylV(g,p,end,r,0x26a69a);
  if(depth>0){
    var d1=dir.clone(); d1.x+=0.4; d1.y+=0.5; d1.normalize();
    var d2=dir.clone(); d2.x+=0.4; d2.y-=0.5; d2.normalize();
    dendrite(g,end,d1,len*0.7,r*0.7,depth-1);
    dendrite(g,end,d2,len*0.7,r*0.7,depth-1);
  }else{
    dot(g,end.x,end.y,end.z,0x4fc3f7,0.08);
  }
}
function buildNeuron(){
  var g=new THREE.Group();
  var soma=new THREE.Mesh(new THREE.SphereGeometry(.65,32,32),matStd(0x26a69a,{roughness:.5}));
  soma.position.set(0,0,0); g.add(soma);
  var nuc=new THREE.Mesh(new THREE.SphereGeometry(.28,24,24),matStd(0x7e57c2));
  nuc.position.set(0,.05,0); g.add(nuc);
  var dirs=[new THREE.Vector3(-.5,.8,.3),new THREE.Vector3(-.7,.2,-.4),
            new THREE.Vector3(-.5,-.8,.3),new THREE.Vector3(-.6,.1,.7),
            new THREE.Vector3(-.5,-.2,-.8)];
  for(var i=0;i<dirs.length;i++){
    dirs[i].normalize();
    dendrite(g,dirs[i].clone().multiplyScalar(.6),dirs[i].clone(),1.1,.16,1);
  }
  makeLabel('Тело клетки (сома)',-0.9,1.5,0,g,.8);
  addCylV(g,new THREE.Vector3(.55,0,0),new THREE.Vector3(7.6,0,0),.09,0x26a69a);
  makeLabel('Аксон',4.1,-1.1,0,g,.8);
  for(var i=0;i<6;i++){
    var seg=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1.0,16),
        matStd(0xffe082,{roughness:.55}));
    seg.rotation.z=Math.PI/2;
    seg.position.set(1.15+i*1.22,0,0);
    g.add(seg);
  }
  makeLabel('Миелиновая оболочка',4.1,1.2,0,g,.8);
  for(var i=0;i<6;i++) dot(g,1.85+i*1.22,0,0,0xff7043,.09);
  var ends=[new THREE.Vector3(8.6,.8,.4),new THREE.Vector3(8.8,0,-.6),new THREE.Vector3(8.5,-.9,.3)];
  for(var i=0;i<ends.length;i++){
    addCylV(g,new THREE.Vector3(7.6,0,0),ends[i],.07,0x26a69a);
    dot(g,ends[i].x,ends[i].y,ends[i].z,0x4fc3f7,.12);
  }
  makeLabel('Нервные окончания',8.2,2.0,0,g,.8);
  return g;
}

/* МЫШЕЧНАЯ: длинное волокно с поперечными полосами и ядрами */
function buildMuscle(){
  var g=new THREE.Group();
  var fiber=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,7,24),
      matStd(0xef5350,{roughness:.55}));
  fiber.rotation.z=Math.PI/2; g.add(fiber);
  for(var i=0;i<9;i++){
    var ring=new THREE.Mesh(new THREE.TorusGeometry(.47,.045,10,32),
        matStd(0xffca28,{roughness:.5}));
    ring.rotation.y=Math.PI/2;
    ring.position.set(-3.1+i*.78,0,0);
    g.add(ring);
  }
  makeLabel('Саркомеры (полосы) — сократимый аппарат',0,-1.2,0,g,.9);
  for(var i=0;i<3;i++){
    var nuc=new THREE.Mesh(new THREE.SphereGeometry(.16,16,16),matStd(0x7e57c2));
    nuc.scale.set(1.6,.8,.8);
    nuc.position.set(-2+i*2,.42,.2); g.add(nuc);
  }
  makeLabel('Множество ядер (симпласт)',0,1.4,0,g,.85);
  makeLabel('Мышечное волокно',-4.3,0,0,g,.8);
  return g;
}

/* ЭПИТЕЛИАЛЬНАЯ: плоская «брусчатка» с микроворсинками */
function buildEpithel(){
  var g=new THREE.Group();
  var cell=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.35,32),
      matStd(0x4dd0e1,{transparent:true,opacity:.55,roughness:.4}));
  g.add(cell);
  var nuc=new THREE.Mesh(new THREE.SphereGeometry(.3,20,20),matStd(0x7e57c2));
  nuc.scale.set(1.2,.6,1.2); nuc.position.y=-.02; g.add(nuc);
  makeLabel('Плоская форма — плотно прилегает к соседям',0,-1.0,0,g,.9);
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2, r=Math.random()*1.2;
    var mv=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.22,6),matStd(0xb2ebf2));
    mv.position.set(Math.cos(a)*r,.28,Math.sin(a)*r); g.add(mv);
  }
  makeLabel('Микроворсинки (увеличивают поверхность)',0,1.1,0,g,.85);
  return g;
}

/* ОСТЕОЦИТ: звёздчатая клетка в лакуне костного матрикса */
function buildOsteo(){
  var g=new THREE.Group();
  var matrix=new THREE.Mesh(new THREE.SphereGeometry(2.0,32,32),
      matStd(0xbcaaa4,{transparent:true,opacity:.22}));
  g.add(matrix);
  makeLabel('Костный матрикс (минералы + коллаген)',0,2.2,0,g,.9);
  var lacuna=new THREE.Mesh(new THREE.SphereGeometry(.85,24,24),
      matStd(0x8d6e63,{transparent:true,opacity:.4}));
  g.add(lacuna);
  makeLabel('Лакуна (полость вокруг клетки)',0,-1.9,0,g,.8);
  var body=new THREE.Mesh(new THREE.SphereGeometry(.45,24,24),matStd(0x7e57c2,{roughness:.5}));
  g.add(body);
  var dirs=[];
  for(var i=0;i<10;i++){
    var a=i*0.628, y=Math.sin(i*1.7)*.8;
    dirs.push(new THREE.Vector3(Math.cos(a),y,Math.sin(a)).normalize());
  }
  for(var i=0;i<dirs.length;i++){
    var end=dirs[i].clone().multiplyScalar(1.9);
    addCylV(g,dirs[i].clone().multiplyScalar(.4),end,.05,0x7e57c2);
    dot(g,end.x,end.y,end.z,0xce93d8,.08);
  }
  makeLabel('Отростки в канальцах',0,-2.4,0,g,.8);
  return g;
}

/* ---------- ТКАНИ ---------- */

function miniNeuron(g,px,py,pz){
  var soma=new THREE.Mesh(new THREE.SphereGeometry(.4,24,24),matStd(0x26a69a,{roughness:.5}));
  soma.position.set(px,py,pz); g.add(soma);
  addCylV(g,new THREE.Vector3(px,py,pz),
    new THREE.Vector3(px-1.4,py+.8,pz),.1,0x26a69a);
  addCylV(g,new THREE.Vector3(px,py,pz),
    new THREE.Vector3(px-1.1,py-.9,pz+.5),.1,0x26a69a);
  var axEnd=new THREE.Vector3(px+3.2,py,pz);
  addCylV(g,new THREE.Vector3(px+.35,py,pz),axEnd,.08,0x26a69a);
  var seg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,2.2,12),matStd(0xffe082,{roughness:.55}));
  seg.rotation.z=Math.PI/2; seg.position.set(px+1.5,py,pz); g.add(seg);
  return axEnd;
}
function buildNervousTissue(){
  var g=new THREE.Group();
  var e1=miniNeuron(g,-4.5,1.2,0);
  var e2=miniNeuron(g,0,-.8,1);
  var e3=miniNeuron(g,4.2,1.0,-.6);
  addCylV(g,e1,new THREE.Vector3(0,-.8,1),.06,0x4fc3f7);
  addCylV(g,e2,new THREE.Vector3(4.2,1.0,-.6),.06,0x4fc3f7);
  dot(g,e1.x,e1.y,e1.z,0xff7043,.14);
  dot(g,e2.x,e2.y,e2.z,0xff7043,.14);
  dot(g,e3.x,e3.y,e3.z,0xff7043,.14);
  makeLabel('Синапсы (оранжевые): сигнал идёт от клетки к клетке',0,2.8,0,g,.9);
  makeLabel('Нервная ткань: нейроны и отростки, проводят импульсы',0,-2.6,0,g,.95);
  return g;
}
function buildMuscleTissue(){
  var g=new THREE.Group();
  for(var j=0;j<3;j++){
    var z=(j-1)*1.1;
    var f=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,7.5,20),
        matStd(0xef5350,{roughness:.55}));
    f.rotation.z=Math.PI/2; f.position.set(0,0,z); g.add(f);
    for(var i=0;i<9;i++){
      var ring=new THREE.Mesh(new THREE.TorusGeometry(.32,.035,8,28),
          matStd(0xffca28,{roughness:.5}));
      ring.rotation.y=Math.PI/2;
      ring.position.set(-3.2+i*.8,0,z); g.add(ring);
    }
    for(var i=0;i<2;i++){
      var nuc=new THREE.Mesh(new THREE.SphereGeometry(.12,12,12),matStd(0x7e57c2));
      nuc.scale.set(1.6,.8,.8);
      nuc.position.set(-1.5+i*3,.28,z+.1); g.add(nuc);
    }
  }
  var sh=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,7.8,24),
      matStd(0xffffff,{transparent:true,opacity:.08}));
  sh.rotation.z=Math.PI/2; g.add(sh);
  makeLabel('Пучок мышечных волокон в оболочке',0,-2.0,0,g,.95);
  makeLabel('Мышечная ткань: сокращается целиком, волокно к волокну',0,2.2,0,g,.95);
  return g;
}
function buildEpithelTissue(){
  var g=new THREE.Group();
  var base=new THREE.Mesh(new THREE.BoxGeometry(8,.12,5.4),
      matStd(0xf48fb1,{transparent:true,opacity:.5}));
  base.position.y=-.25; g.add(base);
  makeLabel('Базальная мембрана (розовая) — «фундамент» слоя',0,-1.2,2.0,g,.9);
  for(var ix=0;ix<5;ix++)for(var iz=0;iz<3;iz++){
    var x=(ix-2)*1.55, z=(iz-1)*1.7;
    var c=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.3,24),
        matStd(0x4dd0e1,{transparent:true,opacity:.55,roughness:.4}));
    c.position.set(x,.05,z); g.add(c);
    var nuc=new THREE.Mesh(new THREE.SphereGeometry(.16,14,14),matStd(0x7e57c2));
    nuc.scale.set(1.2,.6,1.2);
    nuc.position.set(x,.08,z); g.add(nuc);
  }
  makeLabel('Плотный пласт клеток без промежутков — покров и защита',0,1.6,0,g,.95);
  return g;
}
function buildBoneTissue(){
  var g=new THREE.Group();
  var matrix=new THREE.Mesh(new THREE.BoxGeometry(8,3,5),
      matStd(0xbcaaa4,{transparent:true,opacity:.25}));
  g.add(matrix);
  makeLabel('Костный матрикс (кальций + коллаген)',0,1.9,0,g,.9);
  var spots=[[-2.6,.7,-1],[-.4,-.7,.9],[1.9,.5,-.8],[3.1,-.5,1.1],[-3.2,-.6,.8],[.8,1.0,.2]];
  for(var s=0;s<spots.length;s++){
    var x=spots[s][0],y=spots[s][1],z=spots[s][2];
    var lac=new THREE.Mesh(new THREE.SphereGeometry(.3,16,16),
        matStd(0x8d6e63,{transparent:true,opacity:.5}));
    lac.position.set(x,y,z); g.add(lac);
    var body=new THREE.Mesh(new THREE.SphereGeometry(.18,14,14),matStd(0x7e57c2));
    body.position.set(x,y,z); g.add(body);
    for(var i=0;i<6;i++){
      var a=i*1.047;
      var dir=new THREE.Vector3(Math.cos(a),Math.sin(i*1.7)*.5,Math.sin(a)).normalize();
      var end=dir.clone().multiplyScalar(.9).add(new THREE.Vector3(x,y,z));
      addCylV(g,new THREE.Vector3(x,y,z),end,.03,0xce93d8);
    }
  }
  for(var s=0;s<spots.length-1;s++){
    var a=new THREE.Vector3(spots[s][0],spots[s][1],spots[s][2]);
    var b=new THREE.Vector3(spots[s+1][0],spots[s+1][1],spots[s+1][2]);
    addCylV(g,a,b,.025,0xce93d8);
  }
  makeLabel('Остеоциты в лакунах, связаны канальцами — обмениваются веществами',0,-1.9,0,g,.95);
  return g;
}

/* ---------- КРОВЯНЫЕ ТЕЛЬЦА ---------- */
function buildErythrocyte(){
  var g=new THREE.Group();

  /* Двояковогнутый диск: вращаем профиль вокруг вертикальной оси.
     Профиль — половина толщины клетки от центра (r=0) к краю (r=3.4):
     в центре тонко (ямка), на 2/3 радиуса толсто (ободок), к краю снова тонко. */
  var prof=[
    new THREE.Vector2(0.0 ,0.10),
    new THREE.Vector2(0.7 ,0.12),
    new THREE.Vector2(1.5 ,0.30),
    new THREE.Vector2(2.3 ,0.52),
    new THREE.Vector2(2.9 ,0.48),
    new THREE.Vector2(3.3 ,0.28),
    new THREE.Vector2(3.4 ,0.10)
  ];
  var disc=new THREE.Mesh(new THREE.LatheGeometry(prof,64),
      matStd(0xe53935,{roughness:.45,transparent:true,opacity:.92}));
  g.add(disc);

  /* Двойная стенка: вторая такая же деталь отражена вниз —
     получается замкнутая клетка с ямками с обеих сторон */
  var disc2=new THREE.Mesh(new THREE.LatheGeometry(prof,64),
      matStd(0xc62828,{roughness:.5,transparent:true,opacity:.92}));
  disc2.scale.y=-1;
  g.add(disc2);

  /* Гемоглобин — жёлтые точки внутри объёма, ближе к центру */
  for(var i=0;i<26;i++){
    var a=Math.random()*Math.PI*2;
    var r=Math.random()*2.6;
    var y=(Math.random()-0.5)*0.5*Math.max(0.15,1-Math.pow(r/3.2,2));
    dot(g, Math.cos(a)*r, y, Math.sin(a)*r, 0xffca28, 0.07);
  }

  makeLabel('Эритроцит: двояковогнутый диск, БЕЗ ядра',0,1.9,0,g,.95);
  makeLabel('жёлтые точки — гемоглобин (переносит O₂)',0,-1.6,0,g,.85);
  return g;
}
function buildLeukocyte(){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.SphereGeometry(1.1,40,40),
      matStd(0xfaeddc,{roughness:.5,transparent:true,opacity:.92}));
  g.add(body);
  var lobes=[[0,.15,.2],[.55,-.25,0],[-.45,-.3,.1],[.2,.55,-.35]];
  for(var i=0;i<lobes.length;i++){
    var l=new THREE.Mesh(new THREE.SphereGeometry(.42,24,24),
        matStd(0x7e57c2,{roughness:.5}));
    l.position.set(lobes[i][0],lobes[i][1],lobes[i][2]); g.add(l);
  }
  for(var i=0;i<20;i++){
    var a=Math.random()*Math.PI*2, b=Math.random()*Math.PI, r=0.7+Math.random()*0.25;
    dot(g, r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a), 0x4dd0e1, 0.07);
  }
  makeLabel('Лейкоцит: крупный, с лопастным ядром (фиолетовым)',0,1.9,0,g,.95);
  makeLabel('голубые гранулы — ферменты против микробов',0,-1.7,0,g,.85);
  return g;
}
function buildThrombocyte(){
  var g=new THREE.Group();
  var pl=new THREE.Mesh(new THREE.SphereGeometry(0.7,32,32),
      matStd(0xce93d8,{roughness:.55}));
  pl.scale.set(1.4,0.55,1); g.add(pl);
  for(var i=0;i<10;i++){
    var a=Math.random()*Math.PI*2, rr=Math.random()*0.5;
    dot(g, Math.cos(a)*rr*1.2, 0.2, Math.sin(a)*rr, 0x8e24aa, 0.05);
  }
  makeLabel('Тромбоцит: клетка-пластинка без ядра',0,1.4,0,g,.9);
  makeLabel('фиолетовые гранулы — вещества свёртывания',0,-1.1,0,g,.8);
  return g;
}
var bloodTexts={
  ery:"<b>Эритроцит</b> — красная клетка крови в форме двояковогнутого диска. Ядра нет: всё место занято <b>гемоглобином</b>, который переносит кислород от лёгких к тканям. Форма диска даёт большую поверхность для газообмена, а гибкость позволяет протискиваться в капилляры уже самого эритроцита.",
  leuk:"<b>Лейкоцит</b> — белая клетка крови, крупнее эритроцита, с <b>лопастным ядром</b> (фиолетовые доли). Голубые гранулы содержат ферменты: ими лейкоцит переваривает бактерии (фагоцитоз). Это клетка иммунной защиты — она выходит из крови в ткани к очагу воспаления.",
  thromb:"<b>Тромбоцит</b> (кровяная пластинка) — маленький фрагмент клетки без ядра, в 3–4 раза меньше эритроцита. При повреждении сосуда он прилипает к краю раны, склеивается с другими тромбоцитами и выделяет вещества свёртывания — образуется тромб, и кровотечение останавливается."
};

/* ---------- ТЕКСТЫ КЛЕТОК И ТКАНЕЙ ---------- */
var cellTexts={
  neuron:"<b>Нервная клетка (нейрон):</b> тело с ядром, короткие ветвящиеся <b>дендриты</b> принимают сигналы, длинный <b>аксон</b> передаёт их дальше. Миелиновая оболочка (жёлтые сегменты) изолирует аксон и ускоряет импульс в десятки раз, оранжевые точки — перехваты Ранвье.<br><small>Теперь нажми зелёную кнопку — увидишь нервную ткань.</small>",
  muscle:"<b>Мышечная клетка (миоцит):</b> вытянутое волокно с поперечной исчерченностью — это саркомеры из белков актина и миозина (жёлтые кольца). У такой клетки <b>много ядер</b>, потому что она образуется слиянием многих клеток.<br><small>Теперь нажми зелёную кнопку — увидишь мышечную ткань.</small>",
  epithel:"<b>Эпителиальная клетка:</b> плоская, как брусчатка, чтобы плотно прилегать к соседям. Сверху — <b>микроворсинки</b>, увеличивающие поверхность (например, для всасывания в кишечнике).<br><small>Теперь нажми зелёную кнопку — увидишь эпителиальную ткань.</small>",
  osteo:"<b>Остеоцит (клетка кости):</b> звёздчатая, сидит в полости-<b>лакуне</b> внутри костного матрикса. Отростки проходят в тонких канальцах и соединяют остеоциты между собой — так клетки обмениваются питанием, несмотря на твёрдый, почти каменный матрикс.<br><small>Теперь нажми зелёную кнопку — увидишь костную ткань.</small>"
};
var tissueTexts={
  neuron:"<b>Нервная ткань.</b> Нейроны соединены отростками: аксон одной клетки передаёт сигнал дендритам следующей через <b>синапс</b> (оранжевые точки). Так нервная ткань образует «провода» организма — от рефлексов до мышления.",
  muscle:"<b>Мышечная ткань.</b> Волокна лежат пучками в общей оболочке и работают согласованно: сигнал по нерву запускает сокращение сразу целого пучка. Полосы (саркомеры) у всех волокон выровнены — поэтому мышца сокращается одномоментно и мощно.",
  epithel:"<b>Эпителиальная ткань.</b> Клетки образуют <b>сплошной пласт</b> на базальной мембране (розовый «фундамент»). Между клетками нет промежутков — это покров: защищает, отделяет среды, всасывает и выделяет.",
  osteo:"<b>Костная ткань.</b> Остеоциты замурованы в лакуны внутри твёрдого матрикса и связаны отростками через <b>канальцы</b>. Именно эта сеть позволяет кости жить: получать питание и чинить микроповреждения, оставаясь при этом прочной, как железобетон."
};

/* ---------- СБОРКА ---------- */
var groups={neuron:buildNeuron(),muscle:buildMuscle(),epithel:buildEpithel(),osteo:buildOsteo()};
var tissues={neuron:buildNervousTissue(),muscle:buildMuscleTissue(),epithel:buildEpithelTissue(),osteo:buildBoneTissue()};
var blood={ery:buildErythrocyte(),leuk:buildLeukocyte(),thromb:buildThrombocyte()};
for(var k in groups){groups[k].visible=false; scene.add(groups[k]);}
for(var k in tissues){tissues[k].visible=false; scene.add(tissues[k]);}
for(var k in blood){blood[k].visible=false; scene.add(blood[k]);}

var chosen='neuron', mode='cell', bloodChosen='ery';
var info=document.getElementById('info');
var tabsEl=document.getElementById('tabs');
var bloodTabsEl=document.getElementById('bloodTabs');
var tissueBtn=document.getElementById('tissueBtn');
var tissueBack=document.getElementById('tissueBack');
var bloodBack=document.getElementById('bloodBack');

function setView(){
  for(var k in groups) groups[k].visible=(mode==='cell'&&k===chosen);
  for(var k in tissues) tissues[k].visible=(mode==='tissue'&&k===chosen);
  for(var k in blood) blood[k].visible=(mode==='blood'&&k===bloodChosen);
  if(mode==='cell'){
    info.innerHTML=cellTexts[chosen];
    tissueBtn.style.display='inline-block';
    tissueBack.style.display='none';
    bloodBack.style.display='none';
    tabsEl.style.display='flex';
    bloodTabsEl.style.display='none';
    controls.target.set(2,0,0);
    camera.position.set(2,2.5,10);
  }else if(mode==='tissue'){
    info.innerHTML=tissueTexts[chosen];
    tissueBtn.style.display='none';
    tissueBack.style.display='inline-block';
    bloodBack.style.display='none';
    tabsEl.style.display='none';
    bloodTabsEl.style.display='none';
    controls.target.set(0,0,0);
    camera.position.set(0,3.5,11);
  }else{
    info.innerHTML=bloodTexts[bloodChosen];
    tissueBtn.style.display='none';
    tissueBack.style.display='none';
    bloodBack.style.display='inline-block';
    tabsEl.style.display='none';
    bloodTabsEl.style.display='flex';
    controls.target.set(0,0.2,0);
    camera.position.set(0,2.5,8);
  }
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++)
    btns[i].classList.toggle('active',btns[i].getAttribute('data-k')===chosen);
  var bBtns=document.querySelectorAll('#bloodTabs button');
  for(var i=0;i<bBtns.length;i++)
    bBtns[i].classList.toggle('active',bBtns[i].getAttribute('data-b')===bloodChosen);
}
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){
    btn.onclick=function(){
      if(btn.id==='bloodTabBtn'){ mode='blood'; bloodChosen='ery'; setView(); return; }
      chosen=btn.getAttribute('data-k'); mode='cell'; setView();
    };
  })(tabBtns[i]);
}
var bloodBtns=document.querySelectorAll('#bloodTabs button');
for(var i=0;i<bloodBtns.length;i++){
  (function(btn){ btn.onclick=function(){ bloodChosen=btn.getAttribute('data-b'); setView(); }; })(bloodBtns[i]);
}
tissueBtn.onclick=function(){ mode='tissue'; setView(); };
tissueBack.onclick=function(){ mode='cell'; setView(); };
bloodBack.onclick=function(){ mode='cell'; setView(); };

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
setView();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
