<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Митохондрия — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#1a0810;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);
       padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;z-index:2}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3}
</style>
</head>
<body>
<a id="back" href="cells3d.html">← К клеткам</a>
<div id="info"><b>Митохондрия:</b> двухмембранный «энергетик» клетки. Внешняя мембрана (красная), внутренняя образует складки — кристы (розовые волны внутри). В матриксе — кольцевая ДНК (жёлтая) и рибосомы. Здесь синтезируется АТФ.<br><small>Вращай мышкой, колесо — приближение</small></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a0810);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,2,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.55));
const dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(5,8,5); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xff8a80,.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

const mit=new THREE.Group();
// внешняя мембрана — вытянутое тело
const outer=new THREE.Mesh(new THREE.SphereGeometry(1.9,48,48),
  new THREE.MeshStandardMaterial({color:0xe53935,transparent:true,opacity:.28,roughness:.35}));
outer.scale.set(1.9,.75,.8); mit.add(outer);
// внутренняя мембрана + кристы: волнистые складки вдоль тела
for(let i=-2;i<=2;i++){
  const pts=[];
  for(let j=0;j<=24;j++){
    const t=j/24;
    pts.push(new THREE.Vector3(
      -2.7+5.4*t,          // вдоль длины
      i*.42 + Math.sin(t*Math.PI*4)*.16,  // волна = складка кристы
      Math.cos(t*Math.PI*3)*.12));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  mit.add(new THREE.Mesh(new THREE.TubeGeometry(curve,64,.075,10,false),
    new THREE.MeshStandardMaterial({color:0xf06292,roughness:.4})));
}
// кольцевая ДНК в матриксе
const dna=new THREE.Mesh(new THREE.TorusGeometry(.4,.045,10,40),
  new THREE.MeshStandardMaterial({color:0xffee58}));
dna.rotation.x=Math.PI/2.4; dna.position.set(1.1,0,.1); mit.add(dna);
const dna2=dna.clone(); dna2.position.set(-1.2,.1,-.1); dna2.rotation.x=Math.PI/1.8; mit.add(dna2);
// рибосомы
for(let i=0;i<18;i++){
  const r=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),
    new THREE.MeshStandardMaterial({color:0xffca28}));
  r.position.set((Math.random()-.5)*4.6,(Math.random()-.5)*1,(Math.random()-.5)*.9);
  mit.add(r);
}
mit.rotation.z=.1; scene.add(mit);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);mit.rotation.y+=.002;controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
