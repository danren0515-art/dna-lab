<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#12082a;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);
       padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;z-index:2}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3}
</style>
</head>
<body>
<a id="back" href="cells3d.html">← К клеткам</a>
<div id="info"><b>Ядро:</b> двойная мембрана (внешняя — голубая, внутренняя — фиолетовая) с ядерными порами (кольца на поверхности). Внутри — ядрышко (тёмный шар) и хроматин (розовые нити ДНК).<br><small>Вращай мышкой, колесо — приближение</small></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x12082a);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,2,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.5));
const dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(5,8,5); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xb388ff,.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

const nuc=new THREE.Group();
// внутренняя мембрана
const inner=new THREE.Mesh(new THREE.SphereGeometry(2.1,48,48),
  new THREE.MeshStandardMaterial({color:0x7e57c2,transparent:true,opacity:.4,roughness:.4}));
nuc.add(inner);
// внешняя мембрана
const outer=new THREE.Mesh(new THREE.SphereGeometry(2.3,48,48),
  new THREE.MeshStandardMaterial({color:0x42a5f5,transparent:true,opacity:.22}));
nuc.add(outer);
// ядрышко
const nucleolus=new THREE.Mesh(new THREE.SphereGeometry(.65,32,32),
  new THREE.MeshStandardMaterial({color:0x4527a0,roughness:.35}));
nucleolus.position.set(-.4,.5,.2); nuc.add(nucleolus);
// хроматин — переплетённые нити
for(let i=0;i<8;i++){
  const pts=[];
  for(let j=0;j<=20;j++){
    const t=j/20*Math.PI*4;
    pts.push(new THREE.Vector3(
      (Math.random()-.5)*2.4+Math.sin(t)*0.25,
      (Math.random()-.5)*2.4+Math.cos(t)*0.25,
      (Math.random()-.5)*2.4+Math.sin(t*1.3)*0.25));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  nuc.add(new THREE.Mesh(new THREE.TubeGeometry(curve,64,.045,8,false),
    new THREE.MeshStandardMaterial({color:0xf48fb1,roughness:.5})));
}
// ядерные поры — кольца на внешней мембране
for(let i=0;i<26;i++){
  const a=Math.random()*Math.PI*2, b=Math.acos(Math.random()*2-1);
  const pore=new THREE.Mesh(new THREE.TorusGeometry(.12,.045,10,20),
    new THREE.MeshStandardMaterial({color:0xffca28,metalness:.3,roughness:.4}));
  pore.position.set(2.3*Math.sin(b)*Math.cos(a),2.3*Math.cos(b),2.3*Math.sin(b)*Math.sin(a));
  pore.lookAt(0,0,0); nuc.add(pore);
}
scene.add(nuc);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);nuc.rotation.y+=.002;controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
