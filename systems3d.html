<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дыхание и кровообращение — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#050510;color:#fff}
  #info{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);
       padding:12px 20px;border-radius:12px;font-size:14px;text-align:center;max-width:90vw;
       line-height:1.5;z-index:10;border:1px solid rgba(255,255,255,0.1)}
  #back{position:fixed;top:15px;left:15px;background:rgba(255,255,255,0.1);color:#fff;
       padding:8px 16px;border-radius:8px;text-decoration:none;z-index:5;font-size:13px;
       border:1px solid rgba(255,255,255,0.2)}
  #tabs{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:10px;
       z-index:5}
  #tabs button{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);
       border-radius:20px;padding:10px 20px;font-size:14px;cursor:pointer;transition:0.2s}
  #tabs button:hover{background:#4fc3f7;color:#000}
  #tabs button.active{background:#4fc3f7;color:#000;font-weight:bold}
</style>
</head>
<body>
<a id="back" href="index.html">Назад</a>
<div id="info"></div>
<div id="tabs">
  <button data-t="resp" class="active">Дыхание</button>
  <button data-t="circ">Кровообращение</button>
</div>

<script>
window.onerror=function(msg){
  var el=document.getElementById('info');
  if(el) el.innerHTML='<span style="color:#ff5252">Ошибка JS: '+msg+'</span>';
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
var camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
camera.position.set(0,4,14);
controls.target.set(0,0.5,0);
scene.add(new THREE.AmbientLight(0xffffff,0.4));
var dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(5,10,5); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88aaff,0.5); dl2.position.set(-5,-5,-5); scene.add(dl2);

function mat(color,opts){
  if(opts===undefined)opts={};
  opts.color=new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(s===undefined)s=0.12;
  var m=new THREE.Mesh(new THREE.SphereGeometry(s,12,12),mat(color,{roughness:0.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function drawTube(parent,p1,p2,r1,r2,color,opacity){
  var dir=new THREE.Vector3().subVectors(p2,p1);
  var len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,16,1,true),
      mat(color,{transparent:true,opacity:opacity,roughness:0.4,side:THREE.DoubleSide}));
  m.position.copy(p1).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m);
  return m;
}
function makeLabel(text,x,y,z,parent,scale){
  if(scale===undefined)scale=0.8;
  var maxLineW=500;
  var cv=document.createElement('canvas');
  var c=cv.getContext('2d');
  c.font='bold 32px Arial';
  var words=String(text).split(' ');
  var lines=new Array(); var cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(c.measureText(t).width>maxLineW && cur.length>0){lines.push(cur);cur=words[i];}
    else{cur=t;}
  }
  if(cur.length>0)lines.push(cur);
  var w=0;
  for(var i=0;i<lines.length;i++)w=Math.max(w,c.measureText(lines[i]).width);
  cv.width=Math.ceil(w+36);
  cv.height=lines.length*40+24;
  c=cv.getContext('2d');
  c.font='bold 32px Arial';
  c.fillStyle='rgba(10,10,20,0.9)'; c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle='rgba(100,150,255,0.8)'; c.lineWidth=2;
  c.strokeRect(2,2,cv.width-4,cv.height-4);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  for(var i=0;i<lines.length;i++)c.fillText(lines[i],cv.width/2,20+i*40);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false
  }));
  var hgt=0.55*scale;
  sp.scale.set(hgt*cv.width/cv.height,hgt,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* ================= ДЫХАНИЕ ================= */
var BREATH_PERIOD=5.0;
var INHALE_RATIO=0.45;
var HOLD_RATIO=0.15;
var EXHALE_RATIO=0.40;
var breathClock=0;
var alveoliGroup=null;
var alveoliMeshes=new Array();
var molO2=new Array();
var molCO2=new Array();
var branchPoints=new Array();
var mainStart=new THREE.Vector3(0,6.5,0);
var mainEnd=new THREE.Vector3(0,2.5,0);

function getInflation(phase){
  if(phase<INHALE_RATIO) return phase/INHALE_RATIO;
  if(phase<INHALE_RATIO+HOLD_RATIO) return 1;
  var t=(phase-(INHALE_RATIO+HOLD_RATIO))/EXHALE_RATIO;
  return 1-t;
}

function buildRespiration(){
  var g=new THREE.Group();

  drawTube(g, mainStart, mainEnd, 0.6, 0.4, 0xffccbc, 0.25);

  branchPoints=[
    new THREE.Vector3(-1.4, 1.2, 0.6),
    new THREE.Vector3(1.4, 1.2, -0.6),
    new THREE.Vector3(0.6, 1.0, -1.4),
    new THREE.Vector3(-0.6, 1.0, 1.4)
  ];
  for(var i=0;i<branchPoints.length;i++){
    drawTube(g, mainEnd, branchPoints[i], 0.35, 0.2, 0xffab91, 0.35);
  }

  alveoliGroup=new THREE.Group();
  var alvMat=mat(0xffb3ab,{roughness:0.5,transparent:true,opacity:0.8});
  for(var i=0;i<12;i++){
    var r=0.6 + Math.random()*0.4;
    var ang=Math.random()*Math.PI*2;
    var el=Math.random()*Math.PI*0.6;
    var dist=1.0 + Math.random()*0.8;
    var alv=new THREE.Mesh(new THREE.SphereGeometry(r,20,20),alvMat);
    alv.position.set(
      dist*Math.sin(el)*Math.cos(ang),
      dist*Math.cos(el)*0.8 - 0.5,
      dist*Math.sin(el)*Math.sin(ang)
    );
    alveoliGroup.add(alv);
    alveoliMeshes.push(alv);
  }
  g.add(alveoliGroup);

  for(var i=0;i<10;i++){
    var a1=Math.random()*Math.PI*2;
    var p1=new THREE.Vector3(Math.cos(a1)*2.2,-0.8+Math.random()*1.8,Math.sin(a1)*2.2);
    var p2=new THREE.Vector3(Math.cos(a1+1.0)*2.2,-0.8+Math.random()*1.8,Math.sin(a1+1.0)*2.2);
    drawTube(g, p1, p2, 0.03, 0.03, 0xe53935, 0.9);
  }

  makeLabel('Бронхиолы: по ним идет поток воздуха', -3.5, 4.5, 0, g, 0.9);
  makeLabel('Вдох: альвеолы надуваются, O2 входит', 0, 3.5, 2.5, g, 0.9);
  makeLabel('Выдох: альвеолы сдуваются, CO2 выходит', 0, -2.8, -2.5, g, 0.9);
  makeLabel('Капилляры: здесь O2 переходит в кровь', 3.0, -0.5, 1.5, g, 0.8);

  return g;
}

function spawnO2(){
  var branchIdx=Math.floor(Math.random()*branchPoints.length);
  var targetAlv=alveoliMeshes[Math.floor(Math.random()*alveoliMeshes.length)];
  var m=dot(null, 0,0,0, 0x64b5f6, 0.14);
  m.userData={
    type:'o2',
    progress:0,
    speed:1.8,
    path:[mainStart.clone(), mainEnd.clone(), branchPoints[branchIdx].clone(), targetAlv.position.clone()]
  };
  alveoliGroup.parent.add(m);
  molO2.push(m);
}

function spawnCO2(){
  var isH2O=(Math.random()<0.3);
  var startAlv=alveoliMeshes[Math.floor(Math.random()*alveoliMeshes.length)];
  var branchIdx=Math.floor(Math.random()*branchPoints.length);
  var m=dot(null, 0,0,0, isH2O?0x4dd0e1:0xff7043, 0.14);
  m.userData={
    type:isH2O?'h2o':'co2',
    progress:0,
    speed:1.8,
    path:[startAlv.position.clone(), branchPoints[branchIdx].clone(), mainEnd.clone(), new THREE.Vector3(0,7.0,0)]
  };
  alveoliGroup.parent.add(m);
  molCO2.push(m);
}

function killMol(m,arr){
  if(m.parent) m.parent.remove(m);
  var idx=arr.indexOf(m);
  if(idx>-1) arr.splice(idx,1);
}

function moveAlongPath(m,dt){
  m.userData.progress+=m.userData.speed*dt;
  if(m.userData.progress>=1){killMol(m, m.userData.type==='o2'?molO2:molCO2); return;}
  var p=m.userData.progress;
  var pts=m.userData.path;
  var segLen=1/(pts.length-1);
  var segIdx=Math.floor(p/segLen);
  if(segIdx>pts.length-2) segIdx=pts.length-2;
  var t=(p-segIdx*segLen)/segLen;
  m.position.lerpVectors(pts[segIdx], pts[segIdx+1], t);
  var fadeStart=0.85;
  if(p>fadeStart){
    var f=(p-fadeStart)/(1-fadeStart);
    m.scale.setScalar(Math.max(0.01, 1-f*0.8));
  } else if(p<0.1){
    m.scale.setScalar(Math.max(0.05,p/0.1));
  } else {
    m.scale.setScalar(1);
  }
}

function updateRespiration(dt){
  breathClock+=dt;
  var phase=(breathClock%BREATH_PERIOD)/BREATH_PERIOD;
  var infl=getInflation(phase);

  var scaleFactor=1 + 0.35*infl;
  alveoliGroup.scale.setScalar(scaleFactor);

  var isInhaling=(phase<INHALE_RATIO);
  var isExhaling=(phase>=(INHALE_RATIO+HOLD_RATIO));

  if(isInhaling && molO2.length<8){
     if(Math.random()<0.15) spawnO2();
  }
  if(isExhaling && molCO2.length<8){
     if(Math.random()<0.15) spawnCO2();
  }

  for(var i=molO2.length-1;i>=0;i--){ moveAlongPath(molO2[i],dt); }
  for(var i=molCO2.length-1;i>=0;i--){ moveAlongPath(molCO2[i],dt); }
}

/* ================= КРОВООБРАЩЕНИЕ ================= */
var bloodCells=new Array();
function buildRBC(){
  var prof=[new THREE.Vector2(0,0.05),new THREE.Vector2(0.18,0.07),new THREE.Vector2(0.32,0.18),
            new THREE.Vector2(0.44,0.28),new THREE.Vector2(0.48,0.28),new THREE.Vector2(0.5,0.1)];
  var g=new THREE.Group();
  var d1=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xe53935,{roughness:0.4}));
  g.add(d1);
  var d2=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xc62828,{roughness:0.5}));
  d2.scale.y=-1; g.add(d2);
  return g;
}
function buildWBC(){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.SphereGeometry(0.4,20,20),mat(0xfaeddc,{roughness:0.5,transparent:true,opacity:0.9}));
  g.add(body);
  var nuc=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,14),mat(0x7e57c2));
  nuc.position.set(0.08,0.06,0); g.add(nuc);
  return g;
}
function buildPLT(){
  var g=new THREE.Group();
  var p=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,14),mat(0xce93d8,{roughness:0.5}));
  p.scale.set(1.5,0.5,1); g.add(p);
  return g;
}

function buildCirculation(){
  var g=new THREE.Group();
  var wallMat=mat(0xc62828,{roughness:0.5,transparent:true,opacity:0.8});
  var low=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  low.position.y=-2.75; g.add(low);
  var high=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  high.position.y=2.75; g.add(high);
  var win=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,3.0,32),mat(0xef5350,{roughness:0.5,transparent:true,opacity:0.15}));
  g.add(win);

  for(var i=0;i<80;i++){
    var rbc=buildRBC();
    var a=Math.random()*Math.PI*2;
    var r=Math.random()*1.3;
    rbc.position.set(Math.cos(a)*r,-4.5+Math.random()*9,Math.sin(a)*r);
    rbc.userData.spin=0.5+Math.random();
    g.add(rbc); bloodCells.push(rbc);
  }
  for(var i=0;i<4;i++){
    var wbc=buildWBC();
    var a=Math.random()*Math.PI*2;
    var r=Math.random()*1.1;
    wbc.position.set(Math.cos(a)*r,-4.5+Math.random()*9,Math.sin(a)*r);
    wbc.userData.spin=0.3;
    g.add(wbc); bloodCells.push(wbc);
  }
  for(var i=0;i<8;i++){
    var plt=buildPLT();
    var a=Math.random()*Math.PI*2;
    var r=Math.random()*1.3;
    plt.position.set(Math.cos(a)*r,-4.5+Math.random()*9,Math.sin(a)*r);
    plt.userData.spin=1.0;
    g.add(plt); bloodCells.push(plt);
  }
  makeLabel('Поток крови в артерии: снизу вверх', 0, 4.0, 0, g, 0.9);
  makeLabel('Красные диски — эритроциты (их много)', -3.2, 2.2, 0, g, 0.85);
  makeLabel('Белые шары — лейкоциты (мало)', -3.2, 0.4, 0, g, 0.8);
  makeLabel('Лиловые — тромбоциты (мало)', -3.2, -1.4, 0, g, 0.8);
  return g;
}
function updateCirculation(dt){
  for(var i=0;i<bloodCells.length;i++){
    var c=bloodCells[i];
    c.position.y+=2.0*dt;
    c.rotation.x+=c.userData.spin*dt;
    if(c.position.y>4.5) c.position.y=-4.5;
  }
}

/* ================= ВКЛАДКИ ================= */
var viewResp=buildRespiration();
var viewCirc=buildCirculation();
scene.add(viewResp);
scene.add(viewCirc);
viewCirc.visible=false;

var infoEl=document.getElementById('info');
var texts={
  resp:'<b>Дыхание:</b> на вдохе альвеолы надуваются, голубые молекулы O2 летят вниз по бронхиолам внутрь. На выдохе альвеолы сдуваются, оранжевые CO2 и бирюзовые H2O летят вверх по тем же бронхиолам наружу.',
  circ:'<b>Кровообращение:</b> поток клеток движется снизу вверх. Большинство — красные эритроциты, лейкоцитов и тромбоцитов мало — как и в реальной крови.'
};

function setView(t){
  viewResp.visible=(t==='resp');
  viewCirc.visible=(t==='circ');
  infoEl.innerHTML=texts[t];
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-t')===t){btns[i].classList.add('active');}
    else{btns[i].classList.remove('active');}
  }
  if(t==='resp'){
    camera.position.set(0,4,14);
    controls.target.set(0,0.5,0);
  }else{
    camera.position.set(0,3,12);
    controls.target.set(0,0,0);
  }
}
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){
    btn.onclick=function(){ setView(btn.getAttribute('data-t')); };
  })(tabBtns[i]);
}

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

var clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);
  if(viewResp.visible) updateRespiration(dt);
  if(viewCirc.visible) updateCirculation(dt);
  controls.update();
  renderer.render(scene,camera);
})();

setView('resp');
</script>
</body>
</html>
