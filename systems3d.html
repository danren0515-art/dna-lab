<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дыхание и кровообращение — 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#050510;color:#fff}
  #info{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);
       padding:12px 18px;border-radius:14px;font-size:14px;text-align:center;max-width:92vw;
       line-height:1.45;z-index:10;border:1px solid rgba(255,255,255,.12)}
  #back{position:fixed;top:14px;left:14px;background:rgba(255,255,255,.12);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:9;font-size:13px}
  #tabs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
  #tabs button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
       border-radius:20px;padding:10px 20px;font-size:14px;cursor:pointer}
  #tabs button.active{background:#4fc3f7;color:#00243a;font-weight:bold}
  #err{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(120,0,0,.85);
       color:#ffd6d6;padding:8px 14px;border-radius:10px;font-size:12px;z-index:20;display:none;max-width:90vw}
</style>
</head>
<body>
<a id="back" href="index.html">&#8592; Назад</a>
<div id="info"></div>
<div id="tabs">
  <button data-t="resp" class="active">&#129389; Дыхание</button>
  <button data-t="circ">&#10084;&#65039; Кровообращение</button>
</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var ERR=document.getElementById('err');
window.onerror=function(msg){
  ERR.style.display='block';
  ERR.innerText='Ошибка: '+msg;
  return false;
};

/* ---------- СЦЕНА ---------- */
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
var camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
camera.position.set(0,4,16);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,1,0);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
var dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(5,10,5); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88aaff,0.4); dl2.position.set(-5,-5,-5); scene.add(dl2);

/* ---------- ХЕЛПЕРЫ ---------- */
function mat(color,opts){
  var o=opts?opts:{};
  o.color=new THREE.Color(color);
  return new THREE.MeshStandardMaterial(o);
}
function dot(parent,x,y,z,color,s){
  if(!s)s=0.12;
  var m=new THREE.Mesh(new THREE.SphereGeometry(s,12,12),mat(color,{roughness:0.6}));
  m.position.set(x,y,z);
  if(parent)parent.add(m);
  return m;
}
function tube(parent,p1,p2,r1,r2,color,opacity){
  var dir=new THREE.Vector3().subVectors(p2,p1);
  var len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,16,1,true),
      mat(color,{transparent:true,opacity:opacity,roughness:0.45,side:THREE.DoubleSide}));
  m.position.copy(p1).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m);
  return m;
}
function makeLabel(text,x,y,z,parent,scale){
  if(!scale)scale=0.8;
  var maxLineW=500;
  var cv=document.createElement('canvas');
  var c=cv.getContext('2d');
  c.font='bold 34px Arial';
  var words=String(text).split(' ');
  var lines=new Array();
  var cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(c.measureText(t).width>maxLineW&&cur){lines.push(cur);cur=words[i];}
    else{cur=t;}
  }
  if(cur)lines.push(cur);
  var w=0;
  for(var i=0;i<lines.length;i++)w=Math.max(w,c.measureText(lines[i]).width);
  cv.width=Math.ceil(w+40);
  cv.height=lines.length*44+26;
  c=cv.getContext('2d');
  c.font='bold 34px Arial';
  c.fillStyle='rgba(8,10,24,0.88)'; c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle='rgba(120,170,255,0.85)'; c.lineWidth=3;
  c.strokeRect(2,2,cv.width-4,cv.height-4);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  for(var i=0;i<lines.length;i++)c.fillText(lines[i],cv.width/2,21+i*44);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false
  }));
  var hgt=0.58*scale;
  sp.scale.set(hgt*cv.width/cv.height,hgt,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* =================================================
   ВКЛАДКА ДЫХАНИЕ
   Цикл 6 секунд:
   ВДОХ  (0-45%):  альвеолы раздуваются, O2 входит по бронхиолам
   ПАУЗА (45-55%): альвеолы держатся надутыми
   ВЫДОХ (55-95%): альвеолы сдуваются, CO2 и H2O выходят по бронхиолам
   ================================================= */
var BREATH_PERIOD=6.0;
var T_INHALE=0.45, T_HOLD=0.55, T_EXHALE=0.95;
var breathClock=0;
var alveoliGroup=null;
var alveoliMeshes=new Array();
var molO2=new Array();
var molCO2=new Array();
var branchPoints=new Array();
var mainStart=null, mainEnd=null;
var o2Timer=0, co2Timer=0;

function inflation(phase){
  if(phase<T_INHALE)return phase/T_INHALE;
  if(phase<T_HOLD)return 1;
  if(phase<T_EXHALE)return 1-(phase-T_HOLD)/(T_EXHALE-T_HOLD);
  return 0;
}

function buildRespiration(){
  var g=new THREE.Group();

  /* Главный бронх: широкая трубка сверху */
  mainStart=new THREE.Vector3(0,7.0,0);
  mainEnd=new THREE.Vector3(0,2.4,0);
  tube(g,mainStart,mainEnd,0.6,0.42,0xffccbc,0.30);

  /* Четыре ветви бронхиол к грозди альвеол */
  branchPoints.push(new THREE.Vector3(-1.5,1.1,0.6));
  branchPoints.push(new THREE.Vector3(1.5,1.1,-0.6));
  branchPoints.push(new THREE.Vector3(0.7,1.0,-1.5));
  branchPoints.push(new THREE.Vector3(-0.7,1.0,1.5));
  for(var i=0;i<branchPoints.length;i++){
    tube(g,mainEnd,branchPoints[i],0.34,0.18,0xffab91,0.40);
  }

  /* Гроздь альвеол */
  alveoliGroup=new THREE.Group();
  var alvMat=mat(0xffb3ab,{roughness:0.5,transparent:true,opacity:0.8});
  for(var i=0;i<13;i++){
    var r=0.62+Math.random()*0.42;
    var ang=Math.random()*Math.PI*2;
    var el=Math.random()*Math.PI*0.65;
    var dist=1.0+Math.random()*0.9;
    var alv=new THREE.Mesh(new THREE.SphereGeometry(r,22,22),alvMat);
    alv.position.set(
      dist*Math.sin(el)*Math.cos(ang),
      dist*Math.cos(el)*0.75-0.4,
      dist*Math.sin(el)*Math.sin(ang)
    );
    alveoliGroup.add(alv);
    alveoliMeshes.push(alv);
  }
  g.add(alveoliGroup);

  /* Капилляры вокруг грозди */
  for(var i=0;i<10;i++){
    var a1=Math.random()*Math.PI*2;
    var p1=new THREE.Vector3(Math.cos(a1)*2.3,-0.8+Math.random()*1.8,Math.sin(a1)*2.3);
    var p2=new THREE.Vector3(Math.cos(a1+1.1)*2.3,-0.8+Math.random()*1.8,Math.sin(a1+1.1)*2.3);
    tube(g,p1,p2,0.03,0.03,0xe53935,0.9);
  }

  makeLabel('Бронхиол: по ним идёт воздух',-3.6,5.4,0,g,0.9);
  makeLabel('Вдох: альвеолы надуваются, O2 входит',0,4.0,2.6,g,0.9);
  makeLabel('Выдох: альвеолы сдуваются, CO2 и H2O выходят',0,-2.4,-2.6,g,0.9);
  makeLabel('Капилляры: здесь O2 переходит в кровь',3.2,-0.4,1.6,g,0.8);
  return g;
}

/* Позиция на ломаном пути: p от 0 до 1 */
function pathAt(pts,p){
  var total=0;
  var lens=new Array();
  for(var i=0;i<pts.length-1;i++){
    var l=pts[i].distanceTo(pts[i+1]);
    lens.push(l); total+=l;
  }
  if(total<0.0001)return pts[0].clone();
  var d=p*total, acc=0;
  for(var i=0;i<lens.length;i++){
    if(d<=acc+lens[i]||i===lens.length-1){
      var t=(d-acc)/lens[i];
      t=Math.min(Math.max(t,0),1);
      return new THREE.Vector3().lerpVectors(pts[i],pts[i+1],t);
    }
    acc+=lens[i];
  }
  return pts[pts.length-1].clone();
}

function killMol(m,arr){
  if(m.parent)m.parent.remove(m);
  var idx=arr.indexOf(m);
  if(idx>-1)arr.splice(idx,1);
}

function spawnO2(){
  var bIdx=Math.floor(Math.random()*branchPoints.length);
  var alv=alveoliMeshes[Math.floor(Math.random()*alveoliMeshes.length)];
  var m=dot(null,0,0,0,0x64b5f6,0.14);
  m.userData={
    progress:0,
    dur:2.2+Math.random()*0.8,
    path:[mainStart.clone(),mainEnd.clone(),branchPoints[bIdx].clone(),alv.position.clone()]
  };
  viewResp.add(m);
  molO2.push(m);
}

function spawnCO2(){
  var isH2O=(Math.random()<0.35);
  var alv=alveoliMeshes[Math.floor(Math.random()*alveoliMeshes.length)];
  var bIdx=Math.floor(Math.random()*branchPoints.length);
  var m=dot(null,0,0,0,isH2O?0x4dd0e1:0xff7043,0.14);
  m.userData={
    progress:0,
    dur:2.2+Math.random()*0.8,
    path:[alv.position.clone(),branchPoints[bIdx].clone(),mainEnd.clone(),new THREE.Vector3(0,7.4,0)]
  };
  viewResp.add(m);
  molCO2.push(m);
}

function updateRespiration(dt){
  breathClock+=dt;
  var phase=(breathClock%BREATH_PERIOD)/BREATH_PERIOD;
  var infl=inflation(phase);

  /* Пульсация альвеол: +35% на пике вдоха */
  alveoliGroup.scale.setScalar(1+0.35*infl);

  var isInhaling=(phase<T_INHALE);
  var isExhaling=(phase>=T_HOLD&&phase<T_EXHALE);

  /* O2 рождаются ТОЛЬКО на вдохе, CO2/H2O — ТОЛЬКО на выдохе */
  o2Timer+=dt;
  if(isInhaling&&o2Timer>0.35&&molO2.length<9){spawnO2();o2Timer=0;}
  co2Timer+=dt;
  if(isExhaling&&co2Timer>0.35&&molCO2.length<9){spawnCO2();co2Timer=0;}

  /* O2 летят вниз по бронхиолам в альвеолы и растворяются */
  for(var i=molO2.length-1;i>=0;i--){
    var m=molO2[i];
    m.userData.progress+=dt/m.userData.dur;
    var p=m.userData.progress;
    if(p>=1){killMol(m,molO2);continue;}
    m.position.copy(pathAt(m.userData.path,p));
    if(p>0.85){
      var f=(p-0.85)/0.15;
      m.scale.setScalar(Math.max(0.01,1-f));
    }else{m.scale.setScalar(1);}
  }

  /* CO2 и H2O рождаются в альвеолах и летят вверх по бронхиолам наружу */
  for(var i=molCO2.length-1;i>=0;i--){
    var m=molCO2[i];
    m.userData.progress+=dt/m.userData.dur;
    var p=m.userData.progress;
    if(p>=1){killMol(m,molCO2);continue;}
    m.position.copy(pathAt(m.userData.path,p));
    if(p<0.1){
      m.scale.setScalar(Math.max(0.01,p/0.1));
    }else if(p>0.9){
      var f2=(p-0.9)/0.1;
      m.scale.setScalar(Math.max(0.01,1-f2));
    }else{m.scale.setScalar(1);}
  }
}

/* =================================================
   ВКЛАДКА КРОВООБРАЩЕНИЕ
   Артерия с прозрачным «окном» посередине.
   Клетки идут снизу вверх: 90 эритроцитов, 4 лейкоцита, 8 тромбоцитов.
   ================================================= */
var bloodCells=new Array();

function buildRBC(){
  var prof=[
    new THREE.Vector2(0.00,0.05),
    new THREE.Vector2(0.18,0.07),
    new THREE.Vector2(0.32,0.18),
    new THREE.Vector2(0.44,0.28),
    new THREE.Vector2(0.48,0.28),
    new THREE.Vector2(0.50,0.10)
  ];
  var g=new THREE.Group();
  var d1=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xe53935,{roughness:0.45}));
  g.add(d1);
  var d2=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xc62828,{roughness:0.5}));
  d2.scale.y=-1;
  g.add(d2);
  return g;
}
function buildWBC(){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,20),
      mat(0xfaeddc,{roughness:0.5,transparent:true,opacity:0.95}));
  g.add(body);
  var nuc=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,14),mat(0x7e57c2));
  nuc.position.set(0.08,0.06,0);
  g.add(nuc);
  return g;
}
function buildPLT(){
  var g=new THREE.Group();
  var p=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,14),mat(0xce93d8,{roughness:0.55}));
  p.scale.set(1.5,0.5,1);
  g.add(p);
  return g;
}

function buildCirculation(){
  var g=new THREE.Group();
  var wallMat=mat(0xc62828,{roughness:0.5,transparent:true,opacity:0.85});
  var low=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  low.position.y=-2.75; g.add(low);
  var high=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  high.position.y=2.75; g.add(high);
  var windowMesh=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,3.0,32),
      mat(0xef5350,{roughness:0.5,transparent:true,opacity:0.16}));
  g.add(windowMesh);
  var rimMat=mat(0x8e0000);
  var rim1=new THREE.Mesh(new THREE.TorusGeometry(1.62,0.07,10,40),rimMat);
  rim1.rotation.x=Math.PI/2; rim1.position.y=-1.5; g.add(rim1);
  var rim2=new THREE.Mesh(new THREE.TorusGeometry(1.62,0.07,10,40),rimMat);
  rim2.rotation.x=Math.PI/2; rim2.position.y=1.5; g.add(rim2);

  for(var i=0;i<90;i++){
    var rbc=buildRBC();
    placeInVessel(rbc,1.25);
    rbc.userData.spin=0.6+Math.random()*1.6;
    g.add(rbc); bloodCells.push(rbc);
  }
  for(var i=0;i<4;i++){
    var wbc=buildWBC();
    placeInVessel(wbc,1.05);
    wbc.userData.spin=0.3;
    g.add(wbc); bloodCells.push(wbc);
  }
  for(var i=0;i<8;i++){
    var plt=buildPLT();
    placeInVessel(plt,1.3);
    plt.userData.spin=1.2;
    g.add(plt); bloodCells.push(plt);
  }

  makeLabel('Артерия: «окно» в стенке — виден поток клеток',3.4,3.4,0,g,0.95);
  makeLabel('Эритроциты — их большинство, переносят O2',-3.6,2.6,0,g,0.85);
  makeLabel('Белые шары — лейкоциты (их мало)',-3.6,0.6,0,g,0.8);
  makeLabel('Лиловые пластинки — тромбоциты (их тоже мало)',3.4,-1.4,0,g,0.85);
  makeLabel('Клетки движутся в одну сторону — снизу вверх',0,-3.4,0,g,0.9);
  return g;
}
function placeInVessel(mesh,maxR){
  var a=Math.random()*Math.PI*2;
  var r=Math.random()*maxR;
  mesh.position.set(Math.cos(a)*r,-4.5+Math.random()*9,Math.sin(a)*r);
  mesh.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
}
function updateCirculation(dt){
  for(var i=0;i<bloodCells.length;i++){
    var c=bloodCells[i];
    c.position.y+=2.2*dt;
    c.rotation.x+=c.userData.spin*dt;
    c.rotation.z+=c.userData.spin*0.4*dt;
    if(c.position.y>4.6)c.position.y=-4.6;
  }
}

/* ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---------- */
var viewResp=buildRespiration();
var viewCirc=buildCirculation();
scene.add(viewResp);
scene.add(viewCirc);
viewCirc.visible=false;

var infoEl=document.getElementById('info');
var texts={
  resp:'<b>Дыхание.</b> Один цикл из трёх фаз: <b>вдох</b> — альвеолы раздуваются и по бронхиолам внутрь входят голубые молекулы O2; <b>пауза</b> — альвеолы держатся надутыми; <b>выдох</b> — альвеолы сдуваются и по тем же бронхиолам наружу выходят оранжевые CO2 и бирюзовые H2O.',
  circ:'<b>Кровообращение.</b> Артерия с прозрачным «окном»: сквозь него видно поток клеток снизу вверх. Большинство — красные эритроциты, лейкоцитов и тромбоцитов совсем мало — как в реальной крови.'
};
function setView(t){
  viewResp.visible=(t==='resp');
  viewCirc.visible=(t==='circ');
  infoEl.innerHTML=texts[t];
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active',btns[i].getAttribute('data-t')===t);
  }
  if(t==='resp'){
    camera.position.set(0,4,16);
    controls.target.set(0,1.2,0);
  }else{
    camera.position.set(0,3,14);
    controls.target.set(0,0,0);
  }
}
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){
    btn.onclick=function(){ setView(btn.getAttribute('data-t')); };
  })(tabBtns[i]);
}

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

var clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);
  if(viewResp.visible)updateRespiration(dt);
  if(viewCirc.visible)updateCirculation(dt);
  controls.update();
  renderer.render(scene,camera);
})();

setView('resp');
</script>
</body>
</html>
