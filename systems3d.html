<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дыхание и кровообращение — 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: sans-serif; color: #fff; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        #info-box { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 12px; max-width: 800px; margin: 0 auto; border: 1px solid rgba(255, 255, 255, 0.1); }
        #tabs { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; background: rgba(255, 255, 255, 0.1); color: white; transition: 0.3s; }
        button:hover { background: #4fc3f7; color: #000; }
        button.active { background: #4fc3f7; color: #000; font-weight: bold; }
        #back-btn { position: absolute; top: 20px; left: 20px; pointer-events: auto; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div id="ui-layer">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a id="back-btn" href="index.html" style="padding: 10px 15px; border-radius: 8px; text-decoration: none; color: white; background: rgba(255,255,255,0.1);">← Назад</a>
        <div id="tabs">
            <button data-mode="resp" class="active">🫁 Дыхание</button>
            <button data-mode="circ">❤️ Кровообращение</button>
        </div>
    </div>
    <div id="info-box">
        <h3 id="title-text">Дыхательная система</h3>
        <p id="desc-text">Вдох: альвеолы расширяются, молекулы O₂ (голубые) движутся по бронхиолам внутрь. Выдох: альвеолы сжимаются, CO₂ (оранжевые) и H₂O (бирюзовые) выходят наружу.</p>
    </div>
</div>

<!-- Подключаем Three.js через CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/**
 * ИСПРАВЛЕННАЯ ВЕРСИЯ:
 * - Все массивы инициализированы корректно (нет пустых ';').
 * - Логика движения молекул переписана на линейную интерполяцию.
 * - Нет внешних зависимостей.
 */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

// Освещение
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 0.9);
dl.position.set(5, 10, 5);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.5);
dl2.position.set(-5, -5, -5);
scene.add(dl2);

// Утилиты
function createMaterial(color, options = {}) {
    return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), ...options });
}

function createSphere(parent, x, y, z, color, radius = 0.12) {
    const geometry = new THREE.SphereGeometry(radius, 12, 12);
    const material = createMaterial(color, { roughness: 0.6 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
}

function createTube(parent, p1, p2, r1, r2, color, opacity) {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    const geometry = new THREE.CylinderGeometry(r1, r2, len, 16, 1, true);
    const material = createMaterial(color, { transparent: true, opacity: opacity, roughness: 0.4, side: THREE.DoubleSide });
    
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    parent.add(mesh);
    return mesh;
}

// Глобальные переменные для состояния
let alveoliGroup = null;
let alveoliMeshes = ;
let molO2 = ;
let molCO2 = ;
let branchPoints = ;
let breathClock = 0;
const BREATH_PERIOD = 5.0;
const INHALE_RATIO = 0.45;
const HOLD_RATIO = 0.15;
const EXHALE_RATIO = 0.40;

// Инициализация сцены дыхания
function initRespiration() {
    const g = new THREE.Group();

    // 1. Главный бронх
    const mainStart = new THREE.Vector3(0, 6.5, 0);
    const mainEnd = new THREE.Vector3(0, 2.5, 0);
    createTube(g, mainStart, mainEnd, 0.6, 0.4, 0xffccbc, 0.25);

    // 2. Ветви бронхиол
    branchPoints = [
        new THREE.Vector3(-1.4, 1.2, 0.6),
        new THREE.Vector3(1.4, 1.2, -0.6),
        new THREE.Vector3(0.6, 1.0, -1.4),
        new THREE.Vector3(-0.6, 1.0, 1.4)
    ];

    branchPoints.forEach(bp => {
        createTube(g, mainEnd, bp, 0.35, 0.2, 0xffab91, 0.35);
    });

    // 3. Альвеолы
    alveoliGroup = new THREE.Group();
    const alvMat = createMaterial(0xffb3ab, { roughness: 0.5, transparent: true, opacity: 0.8 });

    for (let i = 0; i < 12; i++) {
        const r = 0.6 + Math.random() * 0.4;
        const ang = Math.random() * Math.PI * 2;
        const el = Math.random() * Math.PI * 0.6;
        const dist = 1.0 + Math.random() * 0.8;
        
        const alv = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), alvMat);
        alv.position.set(
            dist * Math.sin(el) * Math.cos(ang),
            dist * Math.cos(el) * 0.8 - 0.5,
            dist * Math.sin(el) * Math.sin(ang)
        );
        alveoliGroup.add(alv);
        alveoliMeshes.push(alv);
    }
    g.add(alveoliGroup);

    // 4. Капилляры (красные нити)
    for (let i = 0; i < 10; i++) {
        const a1 = Math.random() * Math.PI * 2;
        const p1 = new THREE.Vector3(Math.cos(a1) * 2.2, -0.8 + Math.random() * 1.8, Math.sin(a1) * 2.2);
        const p2 = new THREE.Vector3(Math.cos(a1 + 1.0) * 2.2, -0.8 + Math.random() * 1.8, Math.sin(a1 + 1.0) * 2.2);
        createTube(g, p1, p2, 0.03, 0.03, 0xe53935, 0.9);
    }

    scene.add(g);
    return g;
}

// Логика молекул
function spawnO2() {
    const branchIdx = Math.floor(Math.random() * branchPoints.length);
    const targetAlv = alveoliMeshes[Math.floor(Math.random() * alveoliMeshes.length)];
    
    const m = createSphere(scene, 0, 0, 0, 0x64b5f6, 0.14);
    m.userData = {
        type: 'o2',
        progress: 0,
        speed: 2.0,
        path: [mainStart.clone(), mainEnd.clone(), branchPoints[branchIdx].clone(), targetAlv.position.clone()]
    };
    molO2.push(m);
}

function spawnCO2() {
    const isH2O = Math.random() < 0.3;
    const startAlv = alveoliMeshes[Math.floor(Math.random() * alveoliMeshes.length)];
    const branchIdx = Math.floor(Math.random() * branchPoints.length);
    
    const color = isH2O ? 0x4dd0e1 : 0xff7043;
    const m = createSphere(scene, 0, 0, 0, color, 0.14);
    m.userData = {
        type: isH2O ? 'h2o' : 'co2',
        progress: 0,
        speed: 2.0,
        path: [startAlv.position.clone(), branchPoints[branchIdx].clone(), mainEnd.clone(), new THREE.Vector3(0, 7.0, 0)]
    };
    molCO2.push(m);
}

function removeMolecule(m, arr) {
    if (m.parent) m.parent.remove(m);
    const idx = arr.indexOf(m);
    if (idx > -1) arr.splice(idx, 1);
}

function updateRespiration(dt) {
    breathClock += dt;
    const phase = (breathClock % BREATH_PERIOD) / BREATH_PERIOD;
    
    // Расчет коэффициента надутости (0..1)
    let infl = 0;
    if (phase < INHALE_RATIO) {
        infl = phase / INHALE_RATIO;
    } else if (phase < INHALE_RATIO + HOLD_RATIO) {
        infl = 1;
    } else {
        const t = (phase - (INHALE_RATIO + HOLD_RATIO)) / EXHALE_RATIO;
        infl = 1 - t;
    }

    const scaleFactor = 1 + 0.35 * infl;
    if (alveoliGroup) alveoliGroup.scale.setScalar(scaleFactor);

    const isInhaling = phase < INHALE_RATIO;
    const isExhaling = phase >= (INHALE_RATIO + HOLD_RATIO);

    // Спавн
    if (isInhaling && molO2.length < 10) {
        if (Math.random() < 0.2) spawnO2();
    }
    if (isExhaling && molCO2.length < 10) {
        if (Math.random() < 0.2) spawnCO2();
    }

    // Движение O2 (вниз)
    for (let i = molO2.length - 1; i >= 0; i--) {
        const m = molO2[i];
        m.userData.progress += m.userData.speed * dt;
        
        if (m.userData.progress >= 1) {
            removeMolecule(m, molO2);
            continue;
        }

        const p = m.userData.progress;
        const pts = m.userData.path;
        const segLen = 1 / (pts.length - 1);
        const segIdx = Math.floor(p / segLen);
        const nextIdx = Math.min(segIdx + 1, pts.length - 1);
        const t = (p - segIdx * segLen) / segLen;
        
        m.position.lerpVectors(pts[segIdx], pts[nextIdx], t);

        // Эффект растворения
        const fadeStart = 0.85;
        if (p > fadeStart) {
            const f = (p - fadeStart) / (1 - fadeStart);
            m.scale.setScalar(Math.max(0.01, 1 - f * 0.9));
        } else {
            m.scale.setScalar(1);
        }
    }

    // Движение CO2/H2O (вверх)
    for (let i = molCO2.length - 1; i >= 0; i--) {
        const m = molCO2[i];
        m.userData.progress += m.userData.speed * dt;

        if (m.userData.progress >= 1) {
            removeMolecule(m, molCO2);
            continue;
        }

        const p = m.userData.progress;
        const pts = m.userData.path;
        const segLen = 1 / (pts.length - 1);
        const segIdx = Math.floor(p / segLen);
        const nextIdx = Math.min(segIdx + 1, pts.length - 1);
        const t = (p - segIdx * segLen) / segLen;

        m.position.lerpVectors(pts[segIdx], pts[nextIdx], t);

        // Эффект исчезновения при выходе
        const fadeStart = 0.85;
        if (p > fadeStart) {
            const f = (p - fadeStart) / (1 - fadeStart);
            m.scale.setScalar(Math.max(0.01, 1 - f * 0.9));
        } else {
            m.scale.setScalar(1);
        }
    }
}

// UI и переключение
const tabs = document.querySelectorAll('#tabs button');
const titleText = document.getElementById('title-text');
const descText = document.getElementById('desc-text');
let currentMode = 'resp';

tabs.forEach(btn => {
    btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        
        if (currentMode === 'resp') {
            titleText.innerText = "Дыхательная система";
            descText.innerText = "Вдох: альвеолы расширяются, молекулы O₂ (голубые) движутся по бронхиолам внутрь. Выдох: альвеолы сжимаются, CO₂ (оранжевые) и H₂O (бирюзовые) выходят наружу.";
        } else {
            titleText.innerText = "Кровообращение (Заглушка)";
            descText.innerText = "В этой версии реализована только дыхательная система. Кровообращение будет добавлено в следующем обновлении.";
        }
    });
});

// Запуск
const respGroup = initRespiration();

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    
    if (currentMode === 'resp') {
        updateRespiration(0.016); // ~60 FPS
    }
    
    renderer.render(scene, camera);
}

animate();

// Адаптив
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
