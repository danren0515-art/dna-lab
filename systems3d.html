<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дыхание и кровообращение — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);
       padding:12px 18px;border-radius:14px;font-size:14px;text-align:center;max-width:96vw;
       line-height:1.4;z-index:10;white-space:normal}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3;font-size:14px}
  #tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
       flex-wrap:wrap;justify-content:center;z-index:2}
  #tabs button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
       border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
  #tabs button.active{background:#4fc3f7;color:#00243a;font-weight:bold}
</style>
</head>
<body>
<a id="back" href="index.html">← Назад</a>
<div id="info"></div>
<div id="tabs">
  <button data-t="resp" class="active">🫁 Дыхание</button>
  <button data-t="circ">❤️ Кровообращение</button>
</div>

<script>
window.onerror=function(msg){
  var el=document.getElementById('info');
  if(el) el.innerHTML='<span style="color:#ff8787">Ошибка: '+msg+'</span>';
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
camera.position.set(0,4,16);
controls.target.set(0,0.5,0);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
var dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(5,8,5); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88aaff,0.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

function mat(color,opts){
  if(!opts){opts={};}
  opts.color=new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(!s){s=0.12;}
  var m=new THREE.Mesh(new THREE.SphereGeometry(s,10,10),mat(color,{roughness:0.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function tube(parent,a,b,r1,r2,color,opacity){
  var dir=new THREE.Vector3().subVectors(b,a);
  var len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,16,1,true),
      mat(color,{transparent:true,opacity:opacity,roughness:0.5,side:THREE.DoubleSide}));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m); return m;
}
function makeLabel(text,x,y,z,parent,scale){
  if(!scale){scale=0.8;}
  var maxLineW=520;
  var cv=document.createElement('canvas');
  var c=cv.getContext('2d');
  c.font='bold 36px Arial';
  var words=String(text).split(' ');
  var lines=[]; var cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(c.measureText(t).width>maxLineW&&cur){lines.push(cur);cur=words[i];}
    else{cur=t;}
  }
  if(cur){lines.push(cur);}
  var w=0;
  for(var i=0;i<lines.length;i++){w=Math.max(w,c.measureText(lines[i]).width);}
  cv.width=Math.ceil(w+44);
  cv.height=lines.length*46+28;
  c=cv.getContext('2d');
  c.font='bold 36px Arial';
  c.fillStyle='rgba(8,12,28,0.85)'; c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle='rgba(140,170,255,0.8)'; c.lineWidth=3;
  c.strokeRect(2,2,cv.width-4,cv.height-4);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  for(var i=0;i<lines.length;i++){c.fillText(lines[i],cv.width/2,23+i*46);}
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false
  }));
  var hgt=0.62*scale;
  sp.scale.set(hgt*cv.width/cv.height,hgt,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* ================= ВКЛАДКА: ДЫХАНИЕ =================
   Логика синхронизирована с дыхательным циклом:
   ВДОХ (0–42%): альвеолы раздуваются, O2 входит по бронхиолам
   ПАУЗА (42–55%)
   ВЫДОХ (55–92%): альвеолы сдуваются, CO2 и H2O выходят по бронхиолам */
var BREATH_PERIOD=6.0;
var INHALE_END=0.42, HOLD_END=0.55, EXHALE_END=0.92;
var breathClock=0;
var alveoliGroup=null, alveoli=[];
var molO2=[], molCO2=[];
var o2Timer=0, co2Timer=0;
var branchEnds=[];

function breathP(phase){
  if(phase<INHALE_END){return phase/INHALE_END;}
  if(phase<HOLD_END){return 1;}
  if(phase<EXHALE_END){return 1-(phase-HOLD_END)/(EXHALE_END-HOLD_END);}
  return 0;
}

function buildRespiration(){
  var g=new THREE.Group();

  /* Главный бронхиол: широкая трубка сверху, сужается книзу */
  tube(g,new THREE.Vector3(0,7.0,0),new THREE.Vector3(0,2.0,0),0.55,0.3,0xffccbc,0.3);

  /* Ветви бронхиол — ведут к грозди альвеол */
  branchEnds=[
    new THREE.Vector3(-1.5,0.9,0.4),
    new THREE.Vector3(1.5,0.9,-0.4),
    new THREE.Vector3(0,0.7,-1.5),
    new THREE.Vector3(0.2,0.6,1.5)
  ];
  for(var i=0;i<branchEnds.length;i++){
    tube(g,new THREE.Vector3(0,2.0,0),branchEnds[i],0.2,0.13,0xffab91,0.4);
  }

  /* Гроздь альвеол в центре */
  alveoliGroup=new THREE.Group();
  var alvMat=mat(0xffb3ab,{roughness:0.55,transparent:true,opacity:0.75});
  for(var i=0;i<14;i++){
    var r=0.7+Math.random()*0.5;
    var ang=Math.random()*Math.PI*2;
    var el=Math.random()*Math.PI;
    var dist=0.9+Math.random()*1.1;
    var alv=new THREE.Mesh(new THREE.SphereGeometry(r,20,20),alvMat);
    alv.position.set(
      dist*Math.sin(el)*Math.cos(ang),
      dist*Math.cos(el)*0.8-0.2,
      dist*Math.sin(el)*Math.sin(ang)
    );
    alveoliGroup.add(alv);
    alveoli.push(alv);
  }
  g.add(alveoliGroup);

  /* Капиллярная сеть вокруг альвеол */
  for(var i=0;i<8;i++){
    var a1=Math.random()*Math.PI*2;
    var p1=new THREE.Vector3(Math.cos(a1)*2.4,-1.0+Math.random()*2.2,Math.sin(a1)*2.4);
    var p2=new THREE.Vector3(Math.cos(a1+1.2)*2.4,-1.0+Math.random()*2.2,Math.sin(a1+1.2)*2.4);
    tube(g,p1,p2,0.035,0.035,0xe53935,0.9);
  }

  makeLabel('Бронхиол: вход и выход воздуха',-3.2,5.6,0,g,0.9);
  makeLabel('Вдох: альвеолы надуваются — O₂ (голубые) входит',0,4.4,2.6,g,0.9);
  makeLabel('Выдох: альвеолы сдуваются — CO₂ (оранжевые) и H₂O (бирюзовые) выходят',0,-2.2,-2.6,g,0.9);
  makeLabel('Капилляры вокруг альвеол: O₂ уходит в кровь здесь',3.0,-0.6,1.5,g,0.8);
  return g;
}

/* Движение молекулы по ломаной траектории (путь — массив точек) */
function pathPoint(pts,p){
  var segs=[]; var total=0;
  for(var i=0;i<pts.length-1;i++){
    var l=pts[i].distanceTo(pts[i+1]); segs.push(l); total+=l;
  }
  var d=p*total, acc=0;
  for(var i=0;i<segs.length;i++){
    if(d<=acc+segs[i]||i===segs.length-1){
      var t=(d-acc)/segs[i];
      return new THREE.Vector3().lerpVectors(pts[i],pts[i+1],Math.min(Math.max(t,0),1));
    }
    acc+=segs[i];
  }
  return pts[pts.length-1].clone();
}

function spawnO2(){
  var target=branchEnds[Math.floor(Math.random()*branchEnds.length)];
  var alv=alveoli[Math.floor(Math.random()*alveoli.length)];
  var m=dot(null,0,0,0,0x64b5f6,0.13);
  m.userData={
    type:'o2',
    p:0,
    speed:1.7,
    pts:[new THREE.Vector3(0,6.9,0),new THREE.Vector3(0,2.0,0),target.clone(),alv.position.clone()]
  };
  alveoliGroup.parent.add(m);
  molO2.push(m);
}
function spawnCO2(){
  var isH2O=(Math.random()<0.35);
  var alv=alveoli[Math.floor(Math.random()*alveoli.length)];
  var branch=branchEnds[Math.floor(Math.random()*branchEnds.length)];
  var m=dot(null,0,0,0,isH2O?0x4dd0e1:0xff7043,0.13);
  m.userData={
    type:isH2O?'h2o':'co2',
    p:0,
    speed:1.7,
    pts:[alv.position.clone(),branch.clone(),new THREE.Vector3(0,2.0,0),new THREE.Vector3(0,7.2,0)]
  };
  alveoliGroup.parent.add(m);
  molCO2.push(m);
}
function killMol(m,arr){
  m.parent.remove(m);
  arr.splice(arr.indexOf(m),1);
}

function updateRespiration(dt){
  breathClock+=dt;
  var phase=(breathClock%BREATH_PERIOD)/BREATH_PERIOD;
  var p=breathP(phase);

  /* Вдох-выдох: альвеолы дышат синхронно */
  var k=1+0.30*p;
  alveoliGroup.scale.setScalar(k);

  var inhaling=(phase<INHALE_END);
  var exhaling=(phase>=HOLD_END&&phase<EXHALE_END);

  /* O2 рождаются только на вдохе */
  o2Timer+=dt;
  if(inhaling&&o2Timer>0.42&&molO2.length<9){spawnO2();o2Timer=0;}
  /* CO2 и H2O рождаются только на выдохе */
  co2Timer+=dt;
  if(exhaling&&co2Timer>0.4&&molCO2.length<9){spawnCO2();co2Timer=0;}

  /* Движение O2: вниз по бронхиолам, в альвеолы — и растворяются */
  for(var i=molO2.length-1;i>=0;i--){
    var m=molO2[i];
    m.userData.p+=m.userData.speed*dt/BREATH_PERIOD*2.4;
    if(m.userData.p>=1){killMol(m,molO2);continue;}
    m.position.copy(pathPoint(m.userData.pts,m.userData.p));
    var s=Math.max(0.01,1-Math.max(0,(m.userData.p-0.9)/0.1));
    m.scale.setScalar(s);
  }
  /* Движение CO2/H2O: из альвеол, вверх по бронхиолам — и наружу */
  for(var i=molCO2.length-1;i>=0;i--){
    var m=molCO2[i];
    m.userData.p+=m.userData.speed*dt/BREATH_PERIOD*2.4;
    if(m.userData.p>=1){killMol(m,molCO2);continue;}
    m.position.copy(pathPoint(m.userData.pts,m.userData.p));
    var s0=Math.min(1,m.userData.p/0.08);
    m.scale.setScalar(Math.max(0.01,s0));
  }
}

/* ============== ВКЛАДКА: КРОВООБРАЩЕНИЕ ============== */
var bloodCells=[];

function buildRBC(){
  var prof=[
    new THREE.Vector2(0.0,0.05),
    new THREE.Vector2(0.18,0.07),
    new THREE.Vector2(0.32,0.18),
    new THREE.Vector2(0.44,0.28),
    new THREE.Vector2(0.48,0.28),
    new THREE.Vector2(0.50,0.10)
  ];
  var g=new THREE.Group();
  var d1=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xe53935,{roughness:0.45}));
  g.add(d1);
  var d2=new THREE.Mesh(new THREE.LatheGeometry(prof,24),mat(0xc62828,{roughness:0.5}));
  d2.scale.y=-1; g.add(d2);
  return g;
}
function buildWBC(){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,20),
      mat(0xfaeddc,{roughness:0.5,transparent:true,opacity:0.95}));
  g.add(body);
  var nuc=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,14),mat(0x7e57c2));
  nuc.position.set(0.08,0.06,0); g.add(nuc);
  return g;
}
function buildPLT(){
  var g=new THREE.Group();
  var p=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,14),mat(0xce93d8,{roughness:0.55}));
  p.scale.set(1.5,0.5,1); g.add(p);
  return g;
}

function buildCirculation(){
  var g=new THREE.Group();
  var wallMat=mat(0xc62828,{roughness:0.5,transparent:true,opacity:0.85});
  var low=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  low.position.y=-2.75; g.add(low);
  var high=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.5,32),wallMat);
  high.position.y=2.75; g.add(high);
  var win=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,3.0,32),
      mat(0xef5350,{roughness:0.5,transparent:true,opacity:0.16}));
  g.add(win);
  var rimMat=mat(0x8e0000);
  var rim1=new THREE.Mesh(new THREE.TorusGeometry(1.62,0.07,10,40),rimMat);
  rim1.rotation.x=Math.PI/2; rim1.position.y=-1.5; g.add(rim1);
  var rim2=new THREE.Mesh(new THREE.TorusGeometry(1.62,0.07,10,40),rimMat);
  rim2.rotation.x=Math.PI/2; rim2.position.y=1.5; g.add(rim2);

  for(var i=0;i<90;i++){
    var rbc=buildRBC();
    placeInVessel(rbc,1.25);
    rbc.userData.spin=0.6+Math.random()*1.6;
    g.add(rbc); bloodCells.push(rbc);
  }
  for(var i=0;i<4;i++){
    var wbc=buildWBC();
    placeInVessel(wbc,1.05);
    wbc.userData.spin=0.3;
    g.add(wbc); bloodCells.push(wbc);
  }
  for(var i=0;i<8;i++){
    var plt=buildPLT();
    placeInVessel(plt,1.3);
    plt.userData.spin=1.2;
    g.add(plt); bloodCells.push(plt);
  }

  makeLabel('Артерия: «окно» в стенке — видно поток клеток',3.2,3.4,0,g,0.95);
  makeLabel('Эритроциты — их большинство, переносят O₂',-3.4,2.6,0,g,0.85);
  makeLabel('Белые шары — лейкоциты (их мало)',-3.4,0.6,0,g,0.8);
  makeLabel('Лиловые пластинки — тромбоциты (их тоже мало)',3.2,-1.4,0,g,0.85);
  makeLabel('Клетки движутся в одну сторону — снизу вверх',0,-3.4,0,g,0.9);
  return g;
}
function placeInVessel(mesh,maxR){
  var a=Math.random()*Math.PI*2;
  var r=Math.random()*maxR;
  mesh.position.set(Math.cos(a)*r,-4.5+Math.random()*9,Math.sin(a)*r);
  mesh.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
}
function updateCirculation(dt){
  for(var i=0;i<bloodCells.length;i++){
    var c=bloodCells[i];
    c.position.y+=2.2*dt;
    c.rotation.x+=c.userData.spin*dt;
    c.rotation.z+=c.userData.spin*0.4*dt;
    if(c.position.y>4.6){c.position.y=-4.6;}
  }
}

/* ================= ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ================= */
var viewResp=buildRespiration();
var viewCirc=buildCirculation();
scene.add(viewResp);
scene.add(viewCirc);
viewCirc.visible=false;

var info=document.getElementById('info');
var texts={
  resp:'<b>Дыхание.</b> Всё происходит в правильном порядке: <b>вдох</b> — бронхиолы доставляют воздух, альвеолы раздуваются, голубые молекулы O₂ входят внутрь и переходят в капилляры; короткая <b>пауза</b>; <b>выдох</b> — альвеолы сдуваются, оранжевые CO₂ и бирюзовые H₂O выходят наружу по тем же бронхиолам.',
  circ:'<b>Кровообращение.</b> Внутри артерии виден поток крови: подавляющее большинство клеток — эритроциты (переносят кислород), лейкоцитов и тромбоцитов совсем мало. Клетки движутся в одну сторону, как в реальном сосуде.'
};
function setView(t){
  viewResp.visible=(t==='resp');
  viewCirc.visible=(t==='circ');
  info.innerHTML=texts[t];
  var btns=document.querySelectorAll('#tabs button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active',btns[i].getAttribute('data-t')===t);
  }
  if(t==='resp'){
    camera.position.set(0,4,16);
    controls.target.set(0,1.5,0);
  }else{
    camera.position.set(0,3,14);
    controls.target.set(0,0,0);
  }
}
var tabBtns=document.querySelectorAll('#tabs button');
for(var i=0;i<tabBtns.length;i++){
  (function(btn){
    btn.onclick=function(){ setView(btn.getAttribute('data-t')); };
  })(tabBtns[i]);
}

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

var clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);
  if(viewResp.visible){updateRespiration(dt);}
  if(viewCirc.visible){updateCirculation(dt);}
  controls.update();
  renderer.render(scene,camera);
})();

setView('resp');
</script>
</body>
</html>
