<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тестирование — ДНК, митоз, генетика и вирусы</title>
<style>
:root{--bg:#0b1020;--panel:#141c33;--accent:#38bdf8;--accent2:#7dd3fc;--text:#e8ecf5;--sec:#9fb0c8;--border:rgba(120,150,255,.25);--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;line-height:1.5}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;color:var(--accent)}
.back{padding:8px 16px;border:1px solid #444;border-radius:20px;color:var(--text);text-decoration:none;font-size:14px}
.back:hover{background:var(--accent);color:#000}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{color:var(--accent);font-size:22px}
.sub{color:var(--sec);font-size:14px}
button{background:#1c3f8f;color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;font-size:15px;font-weight:bold;font-family:inherit}
button:hover{background:#2a5bd0}
#start{display:block;margin:20px auto 8px;font-size:17px;padding:14px 34px}
.qcard{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:16px 0}
.qnum{color:var(--accent2);font-size:12px;font-weight:bold;letter-spacing:1px}
.qtext{font-size:16px;margin:6px 0 12px;color:#fff}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;margin:7px 0;color:var(--text);cursor:pointer;font-size:14px;font-family:inherit}
.opt:hover:not(:disabled){background:rgba(56,189,248,.18)}
.opt.sel{border-color:var(--accent);background:rgba(56,189,248,.15)}
.opt.ok{border-color:var(--ok);background:rgba(74,222,128,.15)}
.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.15)}
.opt:disabled{cursor:default;opacity:.9}
#submit{display:block;margin:24px auto 0;font-size:16px;padding:14px 30px}
#result{text-align:center;padding:24px;border:1px solid var(--border);border-radius:12px;margin-top:20px;display:none}
#result .big{font-size:42px;font-weight:bold;color:var(--accent)}
#result .msg{color:var(--sec);margin-top:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<span class="logo">🧪 Тестирование</span>
<a class="back" href="index.html">← К моделям</a>
</header>
<main>
<h1>Тест по биологии</h1>
<p class="sub">Из базы в 100 вопросов каждый раз случайным образом собирается тест из 5 вопросов. Варианты ответов тоже перемешиваются. Один правильный ответ на вопрос.</p>

<button id="start">Начать тест</button>

<div id="quiz" class="hidden"></div>
<button id="submit" class="hidden">Проверить ответы</button>

<div id="result">
  <div class="big" id="score"></div>
  <div class="msg" id="verdict"></div>
  <button id="restart">Пройти ещё раз</button>
</div>
</main>

<script>

/* ================== ЛОГИКА ТЕСТА ================== */
const picked=[];      /* текущие 5 вопросов */
const answers=[];     /* индексы выбранных ответов */

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildTest(){
  picked.length=0;answers.length=0;
  const idx=shuffle([...QUESTIONS.keys()]).slice(0,5);
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  quiz.classList.remove('hidden');
  document.getElementById('result').style.display='none';
  document.getElementById('submit').classList.remove('hidden');
  document.getElementById('submit').disabled=false;
  document.getElementById('start').style.display='none';

  idx.forEach((qi,n)=>{
    const src=QUESTIONS[qi];
    /* перемешиваем варианты, отслеживаем правильный */
    const opts=src.a.map((t,i)=>({t,ok:i===src.c}));
    const mixed=shuffle(opts);
    picked.push({q:src.q,mixed,answer:mixed.findIndex(o=>o.ok)});
    answers.push(null);

    const card=document.createElement('div');
    card.className='qcard';
    card.innerHTML=`<div class="qnum">ВОПРОС ${n+1} ИЗ 5</div>
      <div class="qtext">${src.q}</div>`;
    mixed.forEach((o,oi)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.textContent=o.t;
      b.onclick=()=>{
        card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        answers[n]=oi;
      };
      card.appendChild(b);
    });
    quiz.appendChild(card);
  });
}

function checkTest(){
  /* если не на все отвечено — мягко подсвечиваем */
  const unanswered=answers.some(a=>a===null);
  if(unanswered){
    const ok=confirm('Не на все вопросы дан ответ. Проверить то, что есть?');
    if(!ok)return;
  }
  let score=0;
  const cards=document.querySelectorAll('#quiz .qcard');
  picked.forEach((item,n)=>{
    const opts=cards[n].querySelectorAll('.opt');
    opts.forEach((b,oi)=>{
      b.disabled=true;
      if(oi===item.answer)b.classList.add('ok');
      if(answers[n]===oi&&oi!==item.answer)b.classList.add('bad');
    });
    if(answers[n]===item.answer)score++;
  });
  document.getElementById('submit').classList.add('hidden');
  const res=document.getElementById('result');
  res.style.display='block';
  document.getElementById('score').textContent=score+' из 5';
  const msg=[ 'Стоит повторить теорию — загляни в theory.html!',
    'Неплохо, но есть пробелы. Прочти разделы теории и попробуй снова.',
    'Хороший уровень! Ещё чуть-чуть до отличного.',
    'Отличный результат!',
    'Блестяще! Можно смело идти на олимпиаду 🏆' ][score];
  document.getElementById('verdict').textContent=score===0?msg:msg;
}

document.getElementById('start').onclick=buildTest;
document.getElementById('restart').onclick=buildTest;
document.getElementById('submit').onclick=checkTest;
</script>
