<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вирус — 3D</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);
       padding:12px 18px;border-radius:14px;font-size:14px;text-align:center;max-width:96vw;
       line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:10;white-space:normal}
  #back{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.15);color:#fff;
       padding:8px 14px;border-radius:10px;text-decoration:none;z-index:3;font-size:14px}
  #ctrl{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
       flex-wrap:wrap;justify-content:center;z-index:2}
  #ctrl button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
       border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
  #ctrl button.active{background:#4fc3f7;color:#00243a;font-weight:bold}
  #goBtn{background:#1b5e20!important;border-color:#66bb6a!important;font-weight:bold}
  #goBtn:hover{background:#2e7d32!important}
</style>
</head>
<body>
<a id="back" href="index.html">← Назад</a>
<div id="info">Это <b>бактериофаг</b> — вирус, заражающий бактерию. Вращай сцену мышью.
Нажми зелёную кнопку — увидишь, как вирус заражает клетку.</div>
<div id="ctrl">
  <button id="goBtn">▶️ Показать процесс активации</button>
  <button id="resetBtn">🔄 Сброс</button>
</div>

<script>
window.onerror=function(msg){
  var el=document.getElementById('info');
  if(el) el.innerHTML='<span style="color:#ff8787">Ошибка: '+msg+'</span>';
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
camera.position.set(0,6,16);
scene.add(new THREE.AmbientLight(0xffffff,.5));
var dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(5,8,5); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88aaff,.4); dl2.position.set(-5,-3,-5); scene.add(dl2);

function matStd(color,opts){
  if(!opts) opts={};
  opts.color=new THREE.Color(color);
  return new THREE.MeshStandardMaterial(opts);
}
function dot(parent,x,y,z,color,s){
  if(!s) s=0.12;
  var m=new THREE.Mesh(new THREE.SphereGeometry(s,10,10),matStd(color,{roughness:.6}));
  m.position.set(x,y,z); parent.add(m); return m;
}
function addCylV(parent,a,b,r,color){
  var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),matStd(color));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  parent.add(m); return m;
}
function makeLabel(text,x,y,z,parent,scale){
  if(!scale) scale=0.8;
  var maxLineW=520;
  var cv=document.createElement('canvas');
  var c=cv.getContext('2d');
  c.font='bold 36px Arial';
  var words=String(text).split(' ');
  var lines=[],cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(c.measureText(t).width>maxLineW&&cur){lines.push(cur);cur=words[i];}
    else cur=t;
  }
  if(cur)lines.push(cur);
  var w=0;
  for(var i=0;i<lines.length;i++) w=Math.max(w,c.measureText(lines[i]).width);
  cv.width=Math.ceil(w+44);
  cv.height=lines.length*46+28;
  c=cv.getContext('2d');
  c.font='bold 36px Arial';
  c.fillStyle='rgba(8,12,28,0.85)'; c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle='rgba(140,170,255,0.8)'; c.lineWidth=3;
  c.strokeRect(2,2,cv.width-4,cv.height-4);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  for(var i=0;i<lines.length;i++) c.fillText(lines[i],cv.width/2,23+i*46);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false
  }));
  var hgt=0.62*scale;
  sp.scale.set(hgt*cv.width/cv.height,hgt,1);
  sp.position.set(x,y,z);
  parent.add(sp);
  return sp;
}

/* ---------- МОДЕЛЬ ВИРУСА (бактериофаг) ---------- */
function buildVirus(s){
  if(!s) s=1;
  var g=new THREE.Group();
  /* головка-капсид: икосаэдр */
  var head=new THREE.Mesh(new THREE.IcosahedronGeometry(0.9*s,0),
      matStd(0x42a5f5,{transparent:true,opacity:.85,roughness:.35}));
  g.add(head);
  var wire=new THREE.Mesh(new THREE.IcosahedronGeometry(0.95*s,0),
      new THREE.MeshBasicMaterial({color:0x90caf9,wireframe:true}));
  g.add(wire);
  /* ДНК внутри головки — клубок из зелёных бусин */
  var dnaIn=new THREE.Group();
  for(var i=0;i<26;i++){
    var a=Math.random()*Math.PI*2, b=Math.random()*Math.PI;
    var r=Math.random()*0.45*s;
    dot(dnaIn, r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a), 0x69f0ae, 0.09*s);
  }
  g.add(dnaIn);
  /* отросток (хвост) */
  addCylV(g,new THREE.Vector3(0,-0.9*s,0),new THREE.Vector3(0,-1.7*s,0),0.09*s,0x90caf9);
  /* базальная пластинка и ножка */
  var plate=new THREE.Mesh(new THREE.CylinderGeometry(0.3*s,0.3*s,0.12*s,16),
      matStd(0x1565c0));
  plate.position.y=-1.76*s; g.add(plate);
  addCylV(g,new THREE.Vector3(0,-1.82*s,0),new THREE.Vector3(0,-2.05*s,0),0.05*s,0x1565c0);
  /* 6 хвостовых волокон */
  g.userData.fibers=[];
  for(var i=0;i<6;i++){
    var a=i*Math.PI/3;
    var f=addCylV(g,
      new THREE.Vector3(0.1*s*Math.cos(a),-1.9*s,0.1*s*Math.sin(a)),
      new THREE.Vector3(0.85*s*Math.cos(a),-2.45*s,0.85*s*Math.sin(a)),
      0.035*s,0x64b5f6);
    g.userData.fibers.push(f);
  }
  g.userData.dnaIn=dnaIn;
  return g;
}
/* маленькая копия — для «потомства» */
function buildMiniVirus(){
  return buildVirus(0.42);
}

/* ---------- МОДЕЛЬ БАКТЕРИИ ---------- */
function buildBacterium(){
  var g=new THREE.Group();
  var cell=new THREE.Mesh(new THREE.SphereGeometry(3,40,40),
      matStd(0x2e7d32,{transparent:true,opacity:.3,roughness:.4}));
  g.add(cell);
  var dnaCoil=new THREE.Group();
  for(var i=0;i<40;i++){
    var a=i*0.4, r=1.2+0.4*Math.sin(i*0.9);
    dot(dnaCoil, r*Math.cos(a), -0.4+0.5*Math.sin(i*0.55), r*Math.sin(a), 0xaed581, 0.1);
  }
  g.add(dnaCoil);
  for(var i=0;i<16;i++){
    var a=Math.random()*Math.PI*2, b=Math.random()*Math.PI, r=1.6+Math.random()*0.7;
    dot(g, r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a),
        i%3?0x66bb6a:0xffca28, 0.13);
  }
  g.userData.cell=cell;
  g.userData.dnaCoil=dnaCoil;
  return g;
}

var info=document.getElementById('info');
var runToken=0;

function tw(dur,fn,my){
  return new Promise(function(res){
    var t0=performance.now();
    (function step(){
      if(my!==runToken){res();return;}
      var p=Math.min((performance.now()-t0)/dur,1);
      fn(p);
      if(p<1) requestAnimationFrame(step); else res();
    })();
  });
}
var wait=ms=>tw(ms,()=>{});

var virus=null,bact=null,offspring=[];

function resetScene(){
  runToken++;
  if(virus)scene.remove(virus);
  if(bact)scene.remove(bact);
  offspring.forEach(o=>scene.remove(o)); offspring=[];
  bact=buildBacterium();
  bact.position.set(0,-0.5,0);
  bact.userData.cell.scale.setScalar(1);
  bact.userData.cell.material.opacity=.3;
  scene.add(bact);
  virus=buildVirus(1);
  virus.position.set(2.5,4.5,1);
  virus.rotation.z=-0.35;
  scene.add(virus);
  info.innerHTML='Это <b>бактериофаг</b> — вирус, заражающий бактерию. Вращай сцену мышью. Нажми зелёную кнопку — увидишь, как вирус заражает клетку.';
}

function buildStageTexts(){
  return [
    'Стадия 1. <b>Прикрепление (адсорбция).</b> Волокна хвоста распознают рецепторы на поверхности бактерии и «садятся» на неё — как на посадочную площадку.',
    'Стадия 2. <b>Проникновение.</b> Отросток сокращается и прокалывает клеточную стенку. ДНК (зелёные бусины) впрыскивается внутрь клетки — пустой капсид остаётся снаружи.',
    'Стадия 3. <b>Сборка потомства.</b> Клеточные механизмы бактерии перехвачены: вместо своих белков клетка собирает детали новых вирусов по «чертежам» вирусной ДНК.',
    'Стадия 4. <b>Лизис — выход.</b> Фермент разрушает клеточную стенку, клетка лопается, и наружу выходят десятки новых фагов. Они заражают соседние бактерии — цикл повторяется.'
  ];
}

async function runCycle(my){
  var stages=buildStageTexts();
  /* 1. Прикрепление */
  info.innerHTML=stages[0];
  var p0=virus.position.clone();
  var target=new THREE.Vector3(0,2.6,0);
  await tw(1400,p=>{
    virus.position.lerpVectors(p0,target,p);
    virus.rotation.z=-0.35*p;
  });
  if(my!==runToken)return;
  await wait(500); if(my!==runToken)return;
  /* 2. Впрыск ДНК: бусины летят из головки в клетку, ДНК в головке исчезает */
  info.innerHTML=stages[1];
  var tailTip=new THREE.Vector3(0,-2.0,0).add(virus.position);
  var innerTarget=new THREE.Vector3(0,0.2,0);
  for(var i=0;i<12;i++){
    if(my!==runToken)return;
    var b=dot(scene,tailTip.x,tailTip.y,tailTip.z,0x69f0ae,0.1);
    var dir=innerTarget.clone().sub(tailTip).normalize();
    var dist=1.2+Math.random()*1.4;
    var end=tailTip.clone().addScaledVector(dir,dist);
    tw(420,p=>b.position.lerpVectors(tailTip,end,p));
    await wait(110);
  }
  if(my!==runToken)return;
  var dna=virus.userData.dnaIn;
  await tw(500,p=>dna.children.forEach(c=>c.scale.setScalar(Math.max(0.01,1-p))));
  if(my!==runToken)return;
  await wait(600); if(my!==runToken)return;
  /* 3. Сборка новых вирусов внутри клетки */
  info.innerHTML=stages[2];
  for(var i=0;i<8;i++){
    if(my!==runToken)return;
    var mv=buildMiniVirus();
    var a=Math.random()*Math.PI*2, r=Math.random()*1.8;
    mv.position.set(Math.cos(a)*r, -0.5+Math.random()*1.6, Math.sin(a)*r);
    mv.scale.setScalar(0.01);
    mv.visible=false;
    scene.add(mv); offspring.push(mv);
    (function(m){ tw(500,p=>{m.visible=true;m.scale.setScalar(Math.max(0.01,p));}); })(mv);
    await wait(230);
  }
  if(my!==runToken)return;
  await wait(900); if(my!==runToken)return;
  /* 4. Лизис: клетка лопается, вирусы разлетаются */
  info.innerHTML=stages[3];
  var dirs=offspring.map(function(m){
    var d=m.position.clone().sub(new THREE.Vector3(0,-0.5,0)).normalize();
    if(d.length()<0.1)d=new THREE.Vector3(0,1,0);
    return d;
  });
  var starts=offspring.map(m=>m.position.clone());
  await tw(1400,p=>{
    bact.userData.cell.scale.setScalar(1+0.6*p);
    bact.userData.cell.material.opacity=0.3*(1-p);
    bact.userData.dnaCoil.visible=false;
    offspring.forEach((m,i)=>{
      m.position.lerpVectors(starts[i],starts[i].clone().addScaledVector(dirs[i],6.5),p);
    });
  });
  if(my!==runToken)return;
  await wait(400); if(my!==runToken)return;
  scene.remove(bact);
  info.innerHTML='<b>Цикл завершён!</b> Каждая новая вирусная частица способна заразить новую бактерию. Так один фаг за считанные часы может уничтожить целую популяцию бактерий — на этом основаны фаговая терапия и борьба с антибиотикорезистентными микробами.';
  await wait(4000); if(my!==runToken)return;
  resetScene();
}

document.getElementById('goBtn').onclick=function(){
  if(this.dataset.busy)return;
  this.dataset.busy='1';
  runToken++;
  var my=runToken;
  runCycle(my).then(()=>{ delete this.dataset.busy; });
};
document.getElementById('resetBtn').onclick=resetScene;

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
resetScene();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
